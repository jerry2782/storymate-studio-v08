let continuityUploadData='';
function initContinuityAdegan(){const sel=document.getElementById('vidPreviousScene'),target=db.scenes.find(x=>x.id===document.getElementById('vidScene')?.value);if(!sel)return;const choices=db.scenes.filter(x=>x.id!==target?.id&&(!target?.projectId||!x.projectId||x.projectId===target.projectId));sel.innerHTML='<option value="">No previous scene / first scene</option>'+choices.map(x=>'<option value="'+x.id+'">'+esc(x.title)+'</option>').join('');if(target?.continuityReference?.previousSceneId)sel.value=target.continuityReference.previousSceneId;loadContinuityPreview()}
function previewContinuityUpload(){const file=document.getElementById('vidContinuityFile')?.files?.[0],el=document.getElementById('vidContinuityPreview');continuityUploadData='';if(!file||!el)return;if(!file.type.startsWith('image/')){toast('Pilih file gambar');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);continuityUploadData=canvas.toDataURL('image/jpeg',.78);el.innerHTML='<b>Preview:</b> '+esc(file.name)+'<br><img class="previewimg" style="max-height:180px" src="'+continuityUploadData+'" alt="Continuity frame">'};img.onerror=()=>toast('Gambar tidak dapat dibaca');img.src=reader.result};reader.onerror=()=>toast('Gagal membaca gambar');reader.readAsDataURL(file)}
function loadContinuityPreview(){const target=db.scenes.find(x=>x.id===document.getElementById('vidScene')?.value),prevId=document.getElementById('vidPreviousScene')?.value,prev=db.scenes.find(x=>x.id===prevId),el=document.getElementById('vidContinuityPreview');if(!el)return;const ref=target?.continuityReference;if(ref?.data&&ref.previousSceneId===prevId){el.innerHTML='<b>Saved:</b> '+esc(ref.fileName||'Last frame')+'<br><img class="previewimg" style="max-height:180px" src="'+ref.data+'" alt="Saved continuity frame">'}else el.textContent=prev?'Previous scene: '+prev.title+'. Upload its final frame screenshot.':'Pilih scene sebelumnya.'}
async function saveContinuityReference(){const target=db.scenes.find(x=>x.id===document.getElementById('vidScene')?.value),prev=db.scenes.find(x=>x.id===document.getElementById('vidPreviousScene')?.value);if(!target){toast('Pilih scene tujuan pada Source sequence');return}if(!prev||prev.id===target.id){toast('Pilih scene sebelumnya yang berbeda');return}if(prev.projectId&&target.projectId&&prev.projectId!==target.projectId){toast('Pilih previous scene dari project yang sama');return}if(!continuityUploadData&&!target.continuityReference?.data){toast('Unggah screenshot frame terakhir');return}const before=target.continuityReference;target.continuityReference={previousSceneId:prev.id,previousSceneTitle:prev.title,data:continuityUploadData||before.data,fileName:document.getElementById('vidContinuityFile')?.files?.[0]?.name||before?.fileName||'Continuity frame',updated:new Date().toISOString()};if(await saveAndWait()){continuityUploadData='';loadContinuityPreview();toast('Continuity reference tersimpan')}else{target.continuityReference=before;toast('Gagal menyimpan reference')}}

  return c.name+' [Character ID: '+c.id+']\nPERMANENT CHARACTER DNA\nPhysical appearance: '+clean(d.appearance||c.appearance)+'\nPersonality: '+clean(d.personality||c.personality)+'\nVoice identity: '+clean(d.voice||c.voice)+'\nIdentity consistency rules: '+clean(d.consistencyRules||c.consistencyRules,'Preserve the approved face, hairstyle, skin tone and body proportions; do not invent identity changes.')+'\nSCENE VARIATION: '+(variation?(clean(variation.name,'Unnamed variation')+' ('+(variation.type||'Variation')+') — '+clean(variation.description)+' [Variation ID: '+variation.id+']. Apply only to this scene; never overwrite Permanent DNA.'+(/outfit|costume|kostum/i.test(variation.type||'')?' OUTFIT LOCK: change clothing and specified accessories only; preserve the canonical face, hairstyle, skin tone, age, body shape and proportions exactly.':'') ):'No variation selected. Use canonical/default appearance.')+'\nLINKED VISUAL ASSETS\n'+(assetDetails||'No character-linked assets registered.');
 }).join('\n\n');
 let loc=db.locations.find(l=>l.id===s?.locationId)||db.locations.find(l=>l.name===s?.location);
 let projectAssets=(db.assets||[]).filter(a=>project&&a.projectId===project.id&&(!a.characterId||cast.some(c=>c.id===a.characterId)));
 let locRef=loc?loc.name+' [Location ID: '+loc.id+']\nEnvironment: '+clean(loc.environment)+'\nLighting: '+clean(loc.lighting)+'\nAtmosphere: '+clean(loc.atmosphere)+'\nLocation continuity: preserve the approved layout, architecture, props, geography and lighting logic.':clean(v('vidLocation'),'No location reference selected.');
 let assetRefs=projectAssets.map(a=>'- '+(a.name||a.title||'Asset')+' ['+(a.category||a.type||'Reference')+'; Asset ID: '+a.id+']: '+clean(a.notes||a.description,'Project visual reference.')).join('\n');
 const normalizePromptText=x=>String(x||'').toLowerCase().replace(/\s+/g,' ').trim();
 const uniquePromptValues=values=>{let seen=new Set();return values.filter(x=>{let value=String(x||'').trim(),key=normalizePromptText(value);if(!key||seen.has(key))return false;seen.add(key);return true})};
 let beats=(s?.storyBeats||[]).map((b,i)=>{
  let title=String(b.title||'Beat '+(i+1)).trim();
  let actionText=String(b.action||'').trim();
  if(title&&actionText.toLowerCase().startsWith(title.toLowerCase()))actionText=actionText.slice(title.length).trim();
  actionText=actionText.replace(/^Action\s*:\s*/i,'').replace(/\s*Emotional change\s*:\s*[\s\S]*$/i,'').trim();

 }).join('\n\n');
 let dialogue=(s?.dialogueEntries||[]).map(d=>{

  return speaker+': "'+(d.text||'')+'" (Delivery: '+(d.delivery||inferDialogueDelivery(d))+')';
 }).join('\n');
 let beatActions=(s?.storyBeats||[]).flatMap(b=>[b.action,b.description]).filter(Boolean);

 let sceneGestures=uniquePromptValues([s?.gesture]);
 let cameraParts=s?[s.shot&&'Shot type: '+s.shot,s.angle&&'Camera angle: '+s.angle,s.movement&&'Camera movement: '+s.movement,s.lens&&'Lens: '+s.lens,s.camera].filter(Boolean):[];
 if(!cameraParts.length)cameraParts=[continuity?'Continue the previous scene camera geography and screen direction. Use a natural eye-level medium two-shot to re-establish both characters, then use restrained close-ups only when dialogue or emotion calls for them.':'Use a natural eye-level cinematic composition that clearly establishes the characters and location, then use motivated medium shots and close-ups according to the story.','Use smooth, restrained camera movement; avoid arbitrary cuts, sudden reframing or crossing established screen direction.','Choose lens perspective, framing and camera movement automatically to support the emotional beat without changing character positions or spatial geography.'];

 }
 let norm=x=>String(x||'').toLowerCase().replace(/\\s+/g,' ').trim();
 let known=new Set([...storyContext,...visualSetup,...beatActions,...beatEmotions,...sceneActions,...sceneEmotions,...sceneGestures,...cameraParts,...audioParts,...(s?[s.dialogue,s.delivery]:[])].filter(Boolean).map(norm));
 additional=additional.split(/\n+/).map(x=>x.trim()).filter(x=>x&&!known.has(norm(x))).join('\n');

 let negative=v('vidNegative')||'Face distortion, identity drift, inconsistent facial features, changing hairstyle, changing skin tone, incorrect body proportions, wardrobe changes, extra fingers, extra limbs, duplicate characters, unnatural motion, flickering, blurry details, unstable camera, warped background, sudden lighting changes, unrealistic physics.';
 let out=[

 ].filter(Boolean).join('\n\n');
 document.getElementById('videoPromptOutput').textContent=out;window.videoPromptDraft=out;toast('Video prompt berhasil dirakit tanpa pengulangan arahan.');
}
async function saveVideoJob(){let before=(db.generations||[]).slice();try{let prompt=(window.videoPromptDraft||document.getElementById('videoPromptOutput')?.textContent||'').trim();if(!prompt||prompt.startsWith('Pilih metode')){toast('Buat video prompt terlebih dahulu');return}db.generations=db.generations||[];let projectId=document.getElementById('vidProject')?.value||db.activeProject||'',project=db.projects.find(p=>p.id===projectId);db.generations.unshift({id:id(),kind:'video',status:'Prompt Draft',title:document.getElementById('vidMethod')?.value||'Video Prompt',provider:document.getElementById('vidProvider')?.value||'',project:project?.title||'Unassigned',projectId,duration:document.getElementById('vidDuration')?.value||'',resolution:document.getElementById('vidResolution')?.value||'',ratio:document.getElementById('vidRatio')?.value||'',prompt,created:new Date().toISOString()});if(!await saveAndWait()){db.generations=before;toast('Gagal menyimpan ke database. Data sebelumnya dipulihkan; ekspor backup JSON.');return}render();toast('Production prompt tersimpan di My Prompt Drafts')}catch(e){db.generations=before;console.error(e);toast('Terjadi kesalahan saat menyimpan pekerjaan; data sebelumnya dipulihkan')}}
function renderGenerationQueue(kind){let a=(db.generations||[]).filter(x=>x.kind===kind);return a.length?a.slice(0,8).map(x=>`<div class="generation-card"><b>${esc(x.title)}</b> <span class="mini-tag">${esc(x.status)}</span><p>${esc(x.provider||x.project||'')} · ${new Date(x.created).toLocaleString('id-ID')}\n${esc(x.prompt.slice(0,220))}...</p><button class="btn small" onclick="copyText(${JSON.stringify(x.prompt).replace(/</g,'\\u003c')})">Copy prompt</button></div>`).join(''):'<div class="empty">Belum ada pekerjaan tersimpan.</div>'}
function promptDrafts(){let a=(db.generations||[]).slice().sort((x,y)=>new Date(y.created)-new Date(x.created));return `${header('PROMPT RUANG KERJA','My Prompt Drafts','Kumpulan prompt gambar dan video yang tersimpan untuk dilanjutkan kapan saja.')}<div class="panel"><div class="sectionhead"><h2>Saved prompts</h2><span class="mini-tag">${a.length} drafts</span></div>${a.length?a.map(x=>`<div class="generation-card"><div class="sectionhead"><b>${esc(x.title||'Untitled prompt')}</b><span class="mini-tag">${esc(x.kind||'prompt')} · ${esc(x.status||'Draft')}</span></div><p class="muted">${esc(x.project||'Unassigned')} · ${x.created?new Date(x.created).toLocaleString('id-ID'):''}</p><div class="promptout" style="max-height:150px;overflow:auto">${esc(x.prompt||'')}</div><div class="actions" style="margin-top:10px"><button class="btn small" onclick="copyText(${JSON.stringify(x.prompt||'').replace(/</g,'\\u003c')})">Copy Prompt</button><button class="btn small danger" onclick="deleteGeneration('${x.id}')">Delete</button></div></div>`).join(''):'<div class="empty">Belum ada prompt tersimpan. Simpan prompt dari Studio Gambar AI atau Studio Video AI.</div>'}</div>`}
async function deleteGeneration(gid){if(!confirm('Hapus prompt draft ini?'))return;let before=db.generations||[];db.generations=before.filter(x=>x.id!==gid);if(await saveAndWait()){render();toast('Draft dihapus dan tersimpan')}else{db.generations=before;toast('Gagal menghapus draft; data dipulihkan')}}
function academy(){return `${header('LEARN THE WORKFLOW','Akademi Storymate','Panduan penggunaan STORYMATE STUDIO untuk pemula hingga lanjutan.')}
<div class="panel"><h2>Mulai dari sini</h2><div class="studio-step"><div>01</div><div><b>Buat Project</b><small>Masuk ke Proyek Saya, buat judul, genre, dan sinopsis. Pilih project aktif sebelum menyusun produksi.</small></div></div><div class="studio-step"><div>02</div><div><b>Bangun Story dan Sequence</b><small>Susun cerita, pecah menjadi sequence, tentukan durasi, aksi, dialog, emosi, kamera, dan audio.</small></div></div><div class="studio-step"><div>03</div><div><b>Buat DNA Karakter dan DNA Lokasi</b><small>Catat identitas karakter dan detail lokasi agar prompt menjaga konsistensi visual.</small></div></div><div class="studio-step"><div>04</div><div><b>Studio Gambar AI</b><small>Rakit prompt referensi karakter/lokasi. Gunakan layanan eksternal, lalu upload hasilnya ke Pustaka Aset.</small></div></div><div class="studio-step"><div>05</div><div><b>Studio Video AI</b><small>Pilih metode, provider, durasi, resolusi dan rasio. Bangun prompt, salin ke layanan video, lalu simpan hasil produksi di perangkat dan Pustaka Aset.</small></div></div><div class="studio-step"><div>06</div><div><b>Backup data</b><small>Ekspor JSON secara berkala. Data tersimpan lokal di browser dan tidak otomatis tersinkron ke cloud.</small></div></div></div>
<div class="panel"><h2>Video tutorial YouTube</h2><p class="muted">Tautan tutorial resmi akan ditambahkan setelah video panduan STORYMATE STUDIO dipublikasikan. Kami tidak memasang tautan video yang belum diverifikasi.</p><div class="studio-step"><div>▶</div><div><b>Beginner: Membuat project pertama</b><small>Placeholder — video belum dipublikasikan.</small></div></div><div class="studio-step"><div>▶</div><div><b>Intermediate: DNA Karakter, DNA Lokasi dan Sequence</b><small>Placeholder — video belum dipublikasikan.</small></div></div><div class="studio-step"><div>▶</div><div><b>Advanced: Image-to-Video dan menjaga continuity</b><small>Placeholder — video belum dipublikasikan.</small></div></div></div>`}
function production(){let p=activeProjectObj(),cfg=p?.production||{};return `${header('PROJECT CONFIGURATION','Pengaturan Produksi','Atur target film dan batas produksi per project. Pengaturan ini menjadi acuan saat menyiapkan prompt.')}
${!p?'<div class="status-note">Pilih project aktif terlebih dahulu dari Proyek Saya agar pengaturan dapat disimpan.</div>':''}<div class="panel"><h2>${esc(p?.title||'No active project')}</h2><form onsubmit="saveProduction(event)"><div class="formgrid"><div class="field"><label>Runtime mode</label><select name="mode"><option value="Flexible" ${cfg.mode!=='Fixed'?'selected':''}>Flexible — durasi dapat berubah</option><option value="Fixed" ${cfg.mode==='Fixed'?'selected':''}>Fixed — target durasi dikunci</option></select></div><div class="field"><label>Target overall runtime</label><input name="runtime" placeholder="Contoh: 3 menit 28 detik" value="${esc(cfg.runtime||'')}"></div><div class="field"><label>Clip duration per AI generation</label><select name="clip"><option ${cfg.clip==='5 seconds'?'selected':''}>5 seconds</option><option ${cfg.clip==='8 seconds'?'selected':''}>8 seconds</option><option ${cfg.clip==='10 seconds'?'selected':''}>10 seconds</option><option ${cfg.clip==='15 seconds'?'selected':''}>15 seconds</option><option ${cfg.clip==='Custom'?'selected':''}>Custom</option></select></div><div class="field"><label>Resolution</label><select name="resolution"><option ${cfg.resolution==='720p'?'selected':''}>720p</option><option ${cfg.resolution!=='4K'&&cfg.resolution!=='720p'?'selected':''}>1080p</option><option ${cfg.resolution==='4K'?'selected':''}>4K</option></select></div><div class="field"><label>Aspect ratio</label><select name="ratio">${['9:16','16:9','1:1','4:5','2.39:1'].map(x=>`<option ${cfg.ratio===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="actions"><button class="btn primary" ${!p?'disabled':''}>Save Pengaturan Produksi</button></div></form></div><div class="panel"><h2>Compatibility reminder</h2><p class="muted">Setiap AI provider memiliki batas durasi, resolusi, rasio, dan dukungan referensi yang berbeda. Periksa kemampuan provider sebelum mengirim prompt. STORYMATE belum memverifikasi kompatibilitas provider secara otomatis.</p></div>`}
async function saveProduction(e){e.preventDefault();let p=activeProjectObj();if(!p){toast('Pilih project aktif terlebih dahulu');return}let previous=JSON.parse(JSON.stringify(p.production||{})),f=new FormData(e.target);p.production={mode:f.get('mode'),runtime:f.get('runtime'),clip:f.get('clip'),resolution:f.get('resolution'),ratio:f.get('ratio')};if(await saveAndWait())toast('Production settings tersimpan');else{p.production=previous;toast('Gagal menyimpan Pengaturan Produksi; data sebelumnya dipulihkan')}}

function render(){try{applyStudioMode();let v=document.getElementById('view');if(!v)throw new Error('Elemen konten #view tidak ditemukan');let pages={dashboard,projects,workspace,story,characters,locations,storyboard,prompts,assets,settings,imageStudio,videoStudio,academy,production,promptDrafts};let pageRenderer=pages[page]||dashboard;let markup=pageRenderer();if(typeof markup!=='string'||!markup.trim())throw new Error('Halaman '+page+' tidak menghasilkan konten');v.innerHTML=markup;if(page==='videoStudio'){let sel=document.getElementById('vidScene');if(sel)sel.addEventListener('change',()=>{prefillVideo();initContinuityAdegan()});let prevSel=document.getElementById('vidPreviousScene');if(prevSel)prevSel.addEventListener('change',loadContinuityPreview);initContinuityAdegan()}document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}catch(error){console.error('STORYMATE render error:',error);let v=document.getElementById('view');if(v)v.innerHTML='<section style="margin:20px;padding:20px;border:1px solid #ef7777;border-radius:16px;background:#24131b;color:#fff"><h2 style="margin-top:0">Konten gagal dimuat</h2><p>STORYMATE berhasil membuka kerangka aplikasi, tetapi terjadi kesalahan saat menampilkan halaman.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;color:#ffd0d0">'+String(error&&error.stack||error).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre><p>Data project tidak dihapus. Kirim screenshot pesan ini kepada Sol.</p><button class="btn" onclick="location.reload()">Muat ulang aplikasi</button></section>'}}
render();
bootStorage().catch(error=>{console.error('STORYMATE startup error:',error);const v=document.getElementById('view');if(v)v.innerHTML='<section class="panel"><h2>Database belum siap</h2><p class="muted">Beranda tetap dapat dibuka, tetapi pemulihan data perangkat mengalami kendala. Jangan hapus data browser. Muat ulang atau kirim pesan error kepada Sol.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+String(error&&error.stack||error).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre></section>'});
</script>
<script>
(function(){
 function showFatal(label,detail){
  try{
   let box=document.getElementById('storymate-fatal-diagnostic');
   if(!box){box=document.createElement('section');box.id='storymate-fatal-diagnostic';box.style.cssText='position:fixed;z-index:999999;left:12px;right:12px;top:90px;max-height:65vh;overflow:auto;padding:18px;border:2px solid #ff7777;border-radius:14px;background:#24131b;color:#fff;font:14px/1.5 monospace;box-shadow:0 8px 30px #000';document.body.appendChild(box)}
   box.innerHTML='<b>STORYMATE mendeteksi error saat memuat aplikasi</b><p>'+String(label).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+String(detail||'Tidak ada detail').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</pre><p>Kirim screenshot pesan ini kepada Sol. Data tidak dihapus.</p>';
  }catch(ignore){}
 }
 window.addEventListener('error',function(e){showFatal('JavaScript error',((e.message||'Unknown error')+' | '+(e.filename||'')+':'+(e.lineno||'')))});
 window.addEventListener('unhandledrejection',function(e){showFatal('Unhandled promise rejection',e.reason&& (e.reason.stack||e.reason.message)||String(e.reason))});
})();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      console.info('STORYMATE PWA service worker registered', reg.scope);
    }).catch(err => console.warn('PWA service worker registration failed', err));
  });
}
</script>
