.character-choice-list{display:flex!important;flex-direction:column!important;gap:12px!important;max-height:520px!important;overflow-y:auto!important;overflow-x:hidden!important;overscroll-behavior:contain;align-items:stretch!important;align-content:stretch!important}.character-choice-card{display:flex!important;flex-direction:column!important;align-items:stretch!important;justify-content:flex-start!important;gap:12px!important;box-sizing:border-box!important;width:100%!important;height:auto!important;min-height:0!important;flex:0 0 auto!important;background:#151d32!important;border:1px solid #35415f!important;border-radius:16px!important;padding:16px!important;margin:0!important;min-width:0!important;overflow:visible!important;position:relative!important}.character-choice-main{display:flex!important;flex-direction:row!important;align-items:flex-start!important;gap:12px!important;width:100%!important;min-width:0!important;min-height:44px!important;cursor:pointer;font-weight:700;text-align:left}.character-choice-main input{display:block!important;flex:0 0 20px!important;width:20px!important;height:20px!important;margin:2px 0 0!important;accent-color:var(--violet)}.character-choice-copy{display:flex!important;flex:1 1 auto!important;flex-direction:column!important;align-items:flex-start!important;justify-content:flex-start!important;gap:3px!important;min-width:0!important}.character-choice-name{display:block!important;width:100%!important;font-size:15px!important;line-height:1.35!important;overflow-wrap:anywhere}.character-choice-role{display:block!important;width:100%!important;white-space:normal!important;line-height:1.4!important;font-size:12px!important;overflow-wrap:anywhere}.character-choice-variation{display:block!important;position:static!important;flex:none!important;width:100%!important;height:auto!important;min-height:0!important;margin:0!important;padding:0!important;overflow:visible!important}.character-choice-variation label{display:block!important;position:static!important;width:100%!important;height:auto!important;margin:0 0 7px!important;font-size:12px!important;line-height:1.4!important}.character-choice-variation select{display:block!important;visibility:visible!important;opacity:1!important;position:static!important;transform:none!important;box-sizing:border-box!important;flex:none!important;width:100%!important;max-width:100%!important;height:46px!important;min-height:46px!important;margin:0!important;padding:10px 36px 10px 12px!important;background:#0b1020!important;color:var(--text)!important;border:1px solid #465174!important;border-radius:11px!important;z-index:auto!important}@media(max-width:600px){.character-choice-list{max-height:520px!important;gap:12px!important}.character-choice-card{padding:14px!important;gap:11px!important}.character-choice-variation select{height:46px!important;min-height:46px!important}}.hidden{display:none!important}.muted{color:var(--muted)}

.filebox{border:1px dashed #465174;border-radius:13px;padding:14px;color:var(--muted);font-size:12px}.subhead{font-size:12px;letter-spacing:.12em;color:var(--cyan);font-weight:800;margin:18px 0 10px}.hint{font-size:11px;color:var(--muted);margin-top:-5px}.checklist{display:grid;gap:7px}.checkrow{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#101629;font-size:12px}.previewimg{max-width:100%;max-height:120px;border-radius:10px;margin-top:8px}
@media(max-width:850px){.app{display:block}.sidebar{display:none}.main{padding:17px 14px 100px}.topbar{margin-bottom:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:13px}.stat .num{font-size:23px}.cards{grid-template-columns:1fr}.hero{padding:20px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:#0c1020f5;border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;backdrop-filter:blur(15px)}.mobilebar button{background:transparent;border:0;color:#aab4d1;font-size:10px;display:grid;gap:3px;justify-items:center;padding:5px 7px}.mobilebar button span{font-size:19px}.mobilebar button.active{color:#a99aff}.formgrid{grid-template-columns:1fr}.topright .pill{display:none}}

/* V0.3 Story Scene Builder */
.scene-tabs{display:flex;gap:7px;overflow-x:auto;padding:3px 0 12px;margin:4px 0 12px;scrollbar-width:thin}
.scene-tabs a{white-space:nowrap;text-decoration:none;color:#cbd3ed;background:#1a2036;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700}

.scene-section h3{color:#e8eaff;margin:0 0 5px}.scene-section .hint{margin:0 0 13px}

.cast-option{display:flex;align-items:center;gap:9px;background:#0d1425;border:1px solid #303956;border-radius:12px;padding:11px;color:#e6eaff;font-size:13px}

.dialogue-row{display:grid;grid-template-columns:1fr;gap:8px}

.studio-step{display:flex;gap:12px;align-items:flex-start;padding:13px;background:#0d1425;border:1px solid var(--line);border-radius:13px;margin:9px 0}.studio-step b{display:block}.studio-step small{color:var(--muted)}.status-note{padding:12px;border-radius:12px;background:#20243b;border:1px solid #46436c;color:#d9d7ff;font-size:12px}.field textarea.tall{min-height:130px}.mini-tag{font-size:10px;color:#a8e9ef;background:#16303a;padding:4px 8px;border-radius:99px}.generation-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#101629;margin:9px 0}.generation-card p{white-space:pre-wrap;color:#c8d3ed;font-size:12px}.guide-link{display:inline-block;color:#9bdcff;text-decoration:underline;margin:5px 0}

.studio-modal-head h2{margin:0}.dna-block{border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0;background:#0d1425}.dna-block p{white-space:pre-wrap;color:#c7d1ed;margin:6px 0 0;font-size:13px}.variation-card{border:1px solid #34405f;border-radius:13px;padding:13px;margin:9px 0;background:#0d1425}.variation-card small{color:var(--cyan)}.variation-card p{white-space:pre-wrap;color:#c5cee8;font-size:13px;margin:8px 0}.asset-chip{display:inline-block;border:1px solid #34405f;background:#151d33;border-radius:9px;padding:7px 10px;margin:4px;font-size:12px}


/* V0.8.1 Simple / Advanced authoring modes */
body.simple-mode #scene-production,

body.simple-mode #scene-beats .field:has(textarea[oninput*="description"]),
body.simple-mode #scene-beats .field:has(input[oninput*="emotion"]),

<script>
const APP_VERSION='0.8.5.0', BACKUP_SCHEMA=3, KEY='storymate_studio_v01', IDB_NAME='storymate_studio_persistent_v1', IDB_STORE='workspace';
const blank=()=>({projects:[],characters:[],locations:[],scenes:[],assets:[],stories:[],generations:[],production:{},activeProject:''});
let db=blank(),idb=null,storageState={mode:'checking',message:'Memeriksa penyimpanan perangkat…',lastSave:''};
let page='dashboard',promptResult='',assetEditingId='';
function openPersistentDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB tidak tersedia'));return}let req=indexedDB.open(IDB_NAME,1);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains(IDB_STORE))d.createObjectStore(IDB_STORE)};req.onsuccess=()=>{idb=req.result;resolve(idb)};req.onerror=()=>reject(req.error||new Error('Gagal membuka IndexedDB'));req.onblocked=()=>reject(new Error('Database sedang terkunci'))})}
function idbGet(){return new Promise((resolve,reject)=>{try{let tx=idb.transaction(IDB_STORE,'readonly'),r=tx.objectStore(IDB_STORE).get('main');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
function idbPut(value){return new Promise((resolve,reject)=>{try{let tx=idb.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(value,'main');tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||new Error('Gagal menyimpan'));tx.onabort=()=>reject(tx.error||new Error('Penyimpanan dibatalkan'))}catch(e){reject(e)}})}
async function bootStorage(){
 let legacy=null,legacyError='';
 try{const raw=localStorage.getItem(KEY);if(raw){legacy=JSON.parse(raw);if(!legacy||typeof legacy!=='object'||Array.isArray(legacy))throw new Error('Format localStorage lama tidak valid')}}catch(e){legacyError=e?.message||'Data lama tidak dapat dibaca'}
 try{
  await Promise.race([openPersistentDB(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Penyimpanan browser terlalu lama merespons (timeout 8 detik)')),8000))]);let stored=await Promise.race([idbGet(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Pembacaan database terlalu lama merespons (timeout 8 detik)')),8000))]);
  if(stored&&stored.data){
   db=normalizeWorkspaceData(stored.data);
   storageState={mode:'indexeddb',message:'IndexedDB aktif. Data utama dipulihkan dari database browser.',lastSave:stored.savedAt||''};
  }else if(legacy){
   db=normalizeWorkspaceData(legacy);const savedAt=new Date().toISOString();
   await idbPut({data:db,savedAt});
   storageState={mode:'migrated',message:'Data lama ditemukan dan berhasil disalin ke IndexedDB. Buat Full Backup sebagai perlindungan tambahan.',lastSave:savedAt};
  }else{
   db=blank();const savedAt=new Date().toISOString();await idbPut({data:db,savedAt});
   storageState={mode:'indexeddb',message:'Database IndexedDB siap. Belum ada data lama pada penyimpanan ini.',lastSave:savedAt};
  }
 }catch(e){
  console.warn('Persistent storage unavailable',e);
  try{db=legacy?normalizeWorkspaceData(legacy):blank()}catch(normalizeError){db=blank();legacyError=normalizeError?.message||'Data lama rusak'}
  storageState={mode:'fallback',message:'IndexedDB tidak tersedia. '+(legacy?'Data localStorage lama berhasil dibaca, tetapi belum dapat dipindahkan ke IndexedDB. ':'')+(legacyError?'Catatan: '+legacyError+'. ':'')+'Gunakan Export Backup dan jalankan aplikasi melalui HTTPS/PWA.',lastSave:''};
 }
 render();
}
let saveQueue=Promise.resolve(),lastStorageError='';
function save(){
 db.generations=db.generations||[];db.production=db.production||{};
 if(idb){
  let snapshot;try{snapshot=JSON.parse(JSON.stringify(db))}catch(e){lastStorageError=e?.message||'Serialization failed';return false}
  const savedAt=new Date().toISOString();
  saveQueue=saveQueue.catch(()=>{}).then(()=>idbPut({data:snapshot,savedAt})).then(()=>{
   try{localStorage.setItem(KEY,JSON.stringify(snapshot))}catch(e){console.warn('Legacy localStorage mirror unavailable',e)}
   storageState={mode:'indexeddb',message:'Data berhasil dikonfirmasi tersimpan di IndexedDB.',lastSave:savedAt};lastStorageError='';
  }).catch(e=>{
   console.error('IndexedDB save failed',e);lastStorageError=e?.message||'Unknown storage error';
   storageState={mode:'fallback',message:'Penyimpanan database gagal: '+lastStorageError+'. Data belum dikonfirmasi tersimpan; segera ekspor backup JSON jika memungkinkan.',lastSave:storageState.lastSave};
   throw e;
  });
  return true;
 }
 try{localStorage.setItem(KEY,JSON.stringify(db));storageState={mode:'fallback',message:'Data tersimpan di localStorage. Gunakan Export Backup sebagai perlindungan tambahan.',lastSave:new Date().toISOString()};return true}
 catch(e){console.warn('localStorage save failed',e);lastStorageError=e?.message||'Unknown storage error';return false}
}
async function saveAndWait(){const ok=save();if(!ok)return false;try{await saveQueue;return true}catch(e){return false}}
function normalizeWorkspaceData(input){
 const out={...blank(),...(input||{})};
 for(const key of ['projects','characters','locations','scenes','assets','stories','generations']){
  if(!Array.isArray(out[key]))out[key]=[];
  out[key]=out[key].map(item=>{const x={...(item||{})};if(!x.id)x.id=id();return x});
 }
 out.production=out.production&&typeof out.production==='object'?out.production:{};
 out.characters=out.characters.map(c=>{
  c.variations=(Array.isArray(c.variations)?c.variations:[]).map(v=>({...v,id:v.id||id()}));
  c.assetIds=Array.isArray(c.assetIds)?c.assetIds:[];
  c.permanentDNA=c.permanentDNA||{appearance:c.appearance||'',personality:c.personality||'',voice:c.voice||'',consistencyRules:c.consistencyRules||''};
  return c;
 });
 out.scenes=out.scenes.map(scene=>{
  const project=out.projects.find(p=>p.id===scene.projectId)||out.projects.find(p=>p.title===scene.project);
  const location=out.locations.find(l=>l.id===scene.locationId)||out.locations.find(l=>l.name===scene.location);
  const lead=out.characters.find(c=>c.id===scene.characterId)||out.characters.find(c=>c.name===scene.character);
  const castSource=Array.isArray(scene.castIds)?scene.castIds:(lead?[lead.id]:[]);
  const castIds=[...new Set(castSource.filter(cid=>out.characters.some(c=>c.id===cid)))];
  if(lead&&!castIds.includes(lead.id))castIds.unshift(lead.id);
  const dialogueEntries=(Array.isArray(scene.dialogueEntries)?scene.dialogueEntries:[]).map(d=>{const speaker=out.characters.find(c=>c.id===d.characterId)||out.characters.find(c=>c.name===d.characterName);return {...d,characterId:speaker?.id||'',characterName:speaker?.name||d.characterName||''}});
  return {...scene,projectId:project?.id||'',locationId:location?.id||'',characterId:lead?.id||'',castIds,dialogueEntries,storyBeats:Array.isArray(scene.storyBeats)?scene.storyBeats:[]};
 });
 const projectIds=new Set(out.projects.map(x=>x.id)),characterIds=new Set(out.characters.map(x=>x.id)),assetIds=new Set(out.assets.map(x=>x.id));
 out.assets=out.assets.map(a=>({...a,characterId:characterIds.has(a.characterId)?a.characterId:'',projectId:projectIds.has(a.projectId)?a.projectId:''}));
 out.characters=out.characters.map(c=>({...c,assetIds:c.assetIds.filter(aid=>assetIds.has(aid))}));
 out.generations=out.generations.map(g=>({...g,projectId:projectIds.has(g.projectId)?g.projectId:''}));
 out.stories=out.stories.map(st=>({...st,projectId:projectIds.has(st.projectId)?st.projectId:''}));
 if(!projectIds.has(out.activeProject))out.activeProject=out.projects[0]?.id||'';
 return out;
}

function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function saveProject(e,pid){e.preventDefault();let beforeProyek=db.projects.slice(),beforeActive=db.activeProject,f=new FormData(e.target),now=new Date().toISOString(),existing=db.projects.find(x=>x.id===pid)||{};let obj={...existing,id:pid||id(),title:String(f.get('title')||'').trim(),genre:f.get('genre'),description:String(f.get('description')||'').trim(),status:existing.status||'Development',created:existing.created||now,updated:now};if(!obj.title){toast('Judul project wajib diisi');return}let ix=db.projects.findIndex(x=>x.id===pid);if(ix>=0)db.projects[ix]=obj;else{db.projects.unshift(obj);db.activeProject=obj.id}if(await saveAndWait()){render();toast('Project tersimpan')}else{db.projects=beforeProyek;db.activeProject=beforeActive;render();toast('Gagal menyimpan project. Data sebelumnya dipulihkan')}}

async function del(type,pid){
 const collection=db[type];if(!Array.isArray(collection)){toast('Jenis data tidak dikenal');return}
 const item=collection.find(x=>x.id===pid);if(!item)return;
 const refs=[];
 if(type==='projects'){
  const name=item.title||item.name||'';
  db.scenes.forEach(x=>{if(x.projectId===pid||x.project===name)refs.push('Scene: '+(x.title||x.id))});
  db.generations.forEach(x=>{if(x.projectId===pid||x.project===name)refs.push('Prompt/Job: '+(x.title||x.id))});
  db.stories.forEach(x=>{if(x.projectId===pid||x.project===name)refs.push('Story: '+(x.title||x.id))});
  db.assets.forEach(x=>{if(x.projectId===pid||x.project===name)refs.push('Asset: '+(x.name||x.id))});
  db.characters.forEach(x=>{if(x.projectId===pid||x.project===name)refs.push('Character: '+(x.name||x.id))});
 }else if(type==='characters'){
  db.scenes.forEach(x=>{if(x.characterId===pid||(x.castIds||[]).includes(pid)||Object.prototype.hasOwnProperty.call(x.variationIds||x.characterVariations||{},pid)||(x.dialogueEntries||[]).some(d=>d.characterId===pid))refs.push('Scene: '+(x.title||x.id))});
  db.assets.forEach(x=>{if(x.characterId===pid||(item.assetIds||[]).includes(x.id))refs.push('Asset: '+(x.name||x.id))});
 }else if(type==='locations'){
  db.scenes.forEach(x=>{if(x.locationId===pid)refs.push('Scene: '+(x.title||x.id))});
 }else if(type==='assets'){
  db.characters.forEach(x=>{if((x.assetIds||[]).includes(pid))refs.push('Character: '+(x.name||x.id))});
  db.scenes.forEach(x=>{if((x.assetIds||[]).includes(pid))refs.push('Scene: '+(x.title||x.id))});
 }else if(type==='scenes'){
  db.generations.forEach(x=>{if(x.sceneId===pid)refs.push('Prompt/Job: '+(x.title||x.id))});
  db.stories.forEach(x=>{if(x.sceneId===pid||(x.sceneIds||[]).includes(pid))refs.push('Story: '+(x.title||x.id))});
 }
 if(refs.length){openStudioModal(`<div class="studio-modal-head"><div><div class="eyebrow">RELATIONSHIP PROTECTION</div><h2>Item masih digunakan</h2></div><button class="btn ghost" onclick="closeStudioModal()">✕</button></div><p class="muted">Item ini belum dapat dihapus karena masih terhubung dengan data berikut. Lepaskan hubungan tersebut terlebih dahulu.</p><div class="dna-block">${refs.slice(0,20).map(r=>`<p>${esc(r)}</p>`).join('')}${refs.length>20?`<p>… dan ${refs.length-20} hubungan lainnya</p>`:''}</div><button class="btn primary" onclick="closeStudioModal()">Mengerti</button>`);return}
 if(!confirm('Hapus item ini? Tindakan ini tidak dapat dibatalkan.'))return;
 const before=collection,previousActive=db.activeProject;db[type]=collection.filter(x=>x.id!==pid);
 if(type==='projects'&&db.activeProject===pid)db.activeProject=db.projects[0]?.id||'';
 if(await saveAndWait()){render();toast(type==='projects'&&previousActive===pid?(db.activeProject?'Project dihapus. Project berikutnya menjadi aktif.':'Project dihapus. Tidak ada project aktif.'):'Item berhasil dihapus dan penyimpanan dikonfirmasi')}
 else{db[type]=before;db.activeProject=previousActive;render();toast('Gagal menyimpan penghapusan. Data dipulihkan.')}
}

nt DNA Karakter.</small></div><div class="actions"><button class="btn primary">Simpan DNA Karakter</button><button type="button" class="btn ghost" onclick="document.getElementById('charForm').innerHTML=''">Cancel</button></div></form></div>`;document.getElementById('charForm').scrollIntoView({behavior:'smooth'})}
async function saveCharacter(e){e.preventDefault();let before=db.characters.slice(),beforeAssets=db.assets.slice(),f=new FormData(e.target),name=String(f.get('name')||'').trim(),photo=f.get('referencePhoto');if(!name){toast('Nama karakter wajib diisi');return}if(photo&&photo.size>1200000){toast('Foto terlalu besar. Pilih gambar di bawah 1,2 MB.');return}let photoData='';if(photo&&photo.size){try{photoData=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Foto gagal dibaca'));r.readAsDataURL(photo)})}catch(err){toast(err.message);return}}let c={id:id(),name,age:f.get('age'),role:f.get('role'),project:f.get('project')?db.projects.find(p=>p.id===f.get('project'))?.title:'',appearance:f.get('appearance'),personality:f.get('personality'),voice:f.get('voice'),consistencyRules:f.get('rules'),permanentDNA:{appearance:f.get('appearance'),personality:f.get('personality'),voice:f.get('voice'),consistencyRules:f.get('rules')},variations:[],assetIds:[],created:new Date().toISOString()};db.characters.unshift(c);if(photoData){let asset={id:id(),name:'Foto Referensi - '+name,data:photoData,category:'Character Reference',projectId:f.get('project')||'',characterId:c.id,notes:'Foto referensi karakter. Tidak mengubah Permanent DNA Karakter.',created:new Date().toISOString()};db.assets.unshift(asset);c.assetIds.push(asset.id)}if(await saveAndWait()){render();toast(photoData?'DNA Karakter dan foto referensi tersimpan':'Permanent DNA Karakter tersimpan')}else{db.characters=before;db.assets=beforeAssets;render();toast('Gagal menyimpan DNA Karakter. Data sebelumnya dipulihkan')}}

async function saveCharacterDNA(e,cid){
 e.preventDefault();let c=db.characters.find(x=>x.id===cid);if(!c)return;
 let before=JSON.parse(JSON.stringify(c)),f=new FormData(e.target),name=String(f.get('name')||'').trim(),appearance=String(f.get('appearance')||'').trim();
 if(!name||!appearance){toast('Nama dan Permanent appearance wajib diisi');return}
 let projectId=String(f.get('project')||''),project=(db.projects||[]).find(p=>p.id===projectId);
 c.name=name;c.age=String(f.get('age')||'').trim();c.role=String(f.get('role')||'').trim();c.project=project?.title||'';
 c.appearance=appearance;c.personality=String(f.get('personality')||'').trim();c.voice=String(f.get('voice')||'').trim();c.consistencyRules=String(f.get('rules')||'').trim();
 c.permanentDNA={...(c.permanentDNA||{}),appearance:c.appearance,personality:c.personality,voice:c.voice,consistencyRules:c.consistencyRules};
 c.updated=new Date().toISOString();
 if(await saveAndWait()){toast('Permanent DNA Karakter berhasil diperbarui');characterBibleView(cid)}
 else{Object.keys(c).forEach(k=>delete c[k]);Object.assign(c,before);toast('Gagal menyimpan. Data karakter sebelumnya dipulihkan');editCharacterDNA(cid)}
}

function characterBibleView(cid){let c=db.characters.find(x=>x.id===cid);if(!c)return;let dna=c.permanentDNA||{},assets=(db.assets||[]).filter(a=>a.characterId===cid||(c.assetIds||[]).includes(a.id)),variations=c.variations||[];let block=(title,value)=>`<div class="dna-block"><b>${title}</b><p>${esc(value||'Belum diisi')}</p></div>`;openStudioModal(`<div class="studio-modal-head"><div><div class="eyebrow">CANONICAL CHARACTER PROFILE</div><h2>Character Bible · ${esc(c.name)}</h2><small class="muted">Permanent DNA tidak berubah ketika variasi diedit.</small></div><button class="btn ghost" onclick="closeStudioModal()">✕</button></div><div class="formgrid"><div class="dna-block"><b>Identity</b><p>${esc(c.name)}\nAge: ${esc(c.age||'Not set')}\nRole: ${esc(c.role||'Not set')}\nProject: ${esc(c.project||'Not assigned')}</p></div><div class="dna-block"><b>Reference Summary</b><p>${variations.length} variations · ${assets.length} linked assets</p></div></div>${block('Permanent Physical DNA',dna.appearance||c.appearance)}${block('Personality DNA',dna.personality||c.personality)}${block('Voice DNA',dna.voice||c.voice)}${block('Identity Consistency Rules',dna.consistencyRules||c.consistencyRules)}<div class="sectionhead"><h3>Reusable Variations (${variations.length})</h3><button class="btn small primary" onclick="addCharacterVariation('${c.id}')">＋ Add Variation</button></div>${variations.length?variations.map(v=>`<div class="variation-card"><small>${esc(v.type||'Variation')} · ${esc(v.id||'No ID')}</small><b style="display:block;margin-top:4px">${esc(v.name||'Unnamed')}</b><p>${esc(v.description||'No description')}</p><div class="actions"><button class="btn small" onclick="editCharacterVariation('${c.id}','${v.id}')">Edit</button><button class="btn small danger" onclick="deleteCharacterVariation('${c.id}','${v.id}')">Delete</button></div></div>`).join(''):'<div class="empty">Belum ada variasi. Tambahkan kostum, ekspresi, usia cerita, atau kondisi fisik.</div>'}<div class="sectionhead"><h3>Linked Pustaka Aset (${assets.length})</h3><button class="btn small" onclick="closeStudioModal();openCharacterAssetLibrary('${c.id}')">＋ Tambah Referensi</button></div>${assets.length?assets.map(a=>`<div class="variation-card" style="display:flex;gap:12px;align-items:center">${a.data?`<img src="${a.data}" alt="${esc(a.name||'Referensi karakter')}" style="width:88px;height:88px;object-fit:cover;border-radius:10px">`:''}<div><small>${esc(a.category||a.type||'Referensi')}</small><b style="display:block">${esc(a.name||a.title||'Aset')}</b><p>${esc(a.notes||'')}</p><button class="btn small" onclick="editAsset('${a.id}')">Kelola aset</button></div></div>`).join(''):'<p class="muted">Belum ada aset yang terhubung ke karakter ini.</p>'}<div class="actions" style="margin-top:16px"><button class="btn" onclick="closeStudioModal()">Close</button></div>`)}

 const protagonist=v('protagonist')||'Tokoh utama yang akan ditentukan',goal=v('goal')||'Menemukan atau memperjuangkan sesuatu yang penting',obstacle=v('obstacle')||'Hambatan eksternal dan konflik batin',stakes=v('stakes')||'Konsekuensi personal dan hubungan yang dipertaruhkan',setting=v('setting')||'Dunia cerita ditentukan dalam pengembangan berikutnya',theme=v('theme')||'Makna cerita akan dipertajam saat revisi';
 const count=Math.max(1,Math.min(30,Number(v('episodes'))||6));
 const beats=[['ACT I — SETUP','Perkenalkan dunia, tokoh utama, rutinitas, kebutuhan tersembunyi, dan hubungan penting. Tunjukkan keadaan sebelum semuanya berubah.'],['INCITING INCIDENT','Sebuah kejadian mengganggu keseimbangan. Tokoh utama harus merespons dan mulai menghadapi tujuan utama.'],['ACT II — RISING CONFLICT','Hambatan meningkat. Pilihan tokoh menimbulkan konsekuensi, hubungan berubah, dan risiko kegagalan semakin nyata.'],['MIDPOINT — TURNING POINT','Informasi, keberhasilan, atau kegagalan mengubah pemahaman tokoh terhadap masalah. Taruhan cerita meningkat.'],['CRISIS — LOWEST POINT','Rencana utama gagal atau hubungan penting berada di titik terendah. Tokoh dipaksa menghadapi kelemahan atau kesalahan sendiri.'],['ACT III — CLIMAX','Tokoh mengambil keputusan paling menentukan dan menghadapi konflik utama melalui tindakan, bukan sekadar penjelasan.'],['RESOLUTION','Tunjukkan konsekuensi pilihan, perubahan karakter, penyelesaian konflik, dan kesan emosional penutup sesuai ending yang dipilih: '+ending+'.']];
 const serial=['Serial','Web series'].includes(format),total=serial?count:1;
 const labels=['Awal dan pemicu','Keputusan pertama','Konflik berkembang','Titik balik','Tekanan meningkat','Krisis dan konsekuensi','Konfrontasi','Penyelesaian'];
 const episodeList=Array.from({length:total},(_,i)=>{const label=labels[Math.min(labels.length-1,Math.floor(i*labels.length/total))];return 'EPISODE '+(i+1)+' — '+label+'\\nFungsi: '+(i===0?'Memperkenalkan tokoh, dunia, dan pemicu cerita.':i===total-1?'Membayar konflik utama dan memberi resolusi yang memuaskan.':'Mengembangkan konflik, pilihan, relasi, dan konsekuensi menuju klimaks.')+'\\nHook akhir: Sisakan pertanyaan, keputusan, atau perubahan yang mendorong penonton melanjutkan.'});
 const logline=protagonist+' berusaha '+goal.toLowerCase()+' di tengah '+obstacle.toLowerCase()+', sementara '+stakes.toLowerCase()+'.';
 const sections=['STORY BLUEPRINT — '+title.toUpperCase(),'FORMAT: '+format+' | GENRE: '+genre+' | TONE: '+tone+' | AUDIENCE: '+audience,'CORE PREMISE\\n'+idea,'LOGLINE\\n'+logline,'STORY WORLD\\nSetting: '+setting+'\\nTheme: '+theme,'CHARACTER ENGINE\\nProtagonist: '+protagonist+'\\nExternal goal: '+goal+'\\nOpposition: '+obstacle+'\\nStakes: '+stakes+'\\nSuggested character arc: Tokoh bergerak dari kondisi awal yang belum lengkap, menghadapi tekanan, menyadari kesalahan atau kebutuhan batin, lalu mengambil keputusan yang menunjukkan perubahan.','THREE-ACT STORY STRUCTURE\\n'+beats.map((b,i)=>(i+1)+'. '+b[0]+'\\n'+b[1]).join('\\n\\n'),'EPISODE ROADMAP\\n'+episodeList.join('\\n\\n'),'ENDING DIRECTION\\n'+ending+': Bangun akhir sebagai akibat langsung dari pilihan tokoh utama. Pastikan konflik eksternal dan perubahan emosional memperoleh penutup yang sepadan.','DEVELOPMENT CHECKLIST\\n[ ] Tentukan nama, usia, latar belakang, dan kebutuhan batin tokoh utama.\\n[ ] Buat karakter pendukung dengan tujuan yang berbeda.\\n[ ] Tentukan antagonisme dan aturan dunia cerita.\\n[ ] Ubah setiap bagian struktur menjadi rangkaian scene yang memiliki tujuan.\\n[ ] Periksa kesinambungan sebab-akibat, motivasi, dan emosi.'];
 const outline=sections.join('\\n\\n');
 const storyRecord={id:id(),title,genre,idea,format,tone,audience,protagonist,goal,obstacle,stakes,setting,theme,ending,episodeCount:count,projectId:v('projectId'),outline,created:new Date().toISOString(),engineVersion:'0.2-local'};
 const previous=db.stories.slice();db.stories.unshift(storyRecord);
 saveAndWait().then(ok=>{if(!ok){db.stories=previous;toast('Gagal menyimpan Story Blueprint. Data sebelumnya dipulihkan.');return}const el=document.getElementById('storyResult');if(el)el.innerHTML=renderStoryBlueprint(storyRecord);toast('Story Blueprint berhasil dibuat dan disimpan')}).catch(()=>{db.stories=previous;toast('Penyimpanan gagal. Story Blueprint tidak disimpan.')});

function developSixEpisodeSeries(storyId){

 ['A Conversation Begins','Enzo membuka percakapan setelah pertengkaran. Yuna menjelaskan bahwa ia masih kecewa dan ingin didengarkan, bukan sekadar diberi permintaan maaf.','Yuna mulai mengungkapkan hal yang selama ini ia pendam.'],
 ['The Truth Behind Her Silence','Yuna menjelaskan hal-hal yang membuatnya merasa tidak dipahami. Enzo mendengarkan tanpa memotong atau mengalihkan pembicaraan.','Enzo menyadari bahwa masalah mereka lebih dalam daripada pertengkaran terakhir.'],
 ["Enzo's Realization",'Enzo meninjau kembali sikap dan pilihannya. Ia mengakui tanggung jawabnya dan mulai menunjukkan perubahan melalui tindakan kecil.','Yuna belum yakin apakah perubahan Enzo akan bertahan.'],
 ['Another Misunderstanding','Komunikasi yang tidak jelas memunculkan kesalahpahaman baru. Keduanya diuji untuk memilih antara bereaksi atau bertanya dengan jujur.','Yuna mempertanyakan apakah mereka benar-benar bisa berubah.'],
 ['The Courage to Change','Enzo mengambil tanggung jawab secara terbuka dan menunjukkan perubahan nyata tanpa menuntut Yuna langsung memaafkan.','Yuna mulai memberi ruang bagi Enzo untuk membuktikan niatnya.'],
 ['A New Beginning','Enzo dan Yuna membicarakan batasan, harapan, dan langkah konkret ke depan. Mereka tidak menghapus luka masa lalu, tetapi memilih memulai dengan kejujuran.','Hubungan mendapat kesempatan baru, dengan perubahan yang harus terus dijaga.']
 ];
 const episodeText=eps.map((e,i)=>'EPISODE '+(i+1)+' — '+e[0]+'\nStory function: '+e[1]+'\nEmotional turn: '+e[2]).join('\n\n');
 const logline='Setelah pertengkaran mengancam hubungan mereka, Enzo berusaha mendapatkan kembali kepercayaan Yuna. Namun, ketika percakapan untuk berdamai membuka luka dan kekecewaan yang selama ini terpendam, keduanya harus memilih antara mempertahankan ego atau berani saling memahami sebelum kehilangan hubungan yang masih mereka perjuangkan.';
 const arcs='ENZO: Berawal dari keinginan agar hubungan segera kembali baik, ia belajar mendengarkan tanpa defensif, mengakui dampak tindakannya, dan membuktikan perubahan secara konsisten.\nYUNA: Berawal dari kekecewaan dan keraguan, ia belajar menyampaikan kebutuhan serta batasannya dengan jujur, lalu menilai perubahan Enzo berdasarkan tindakan, bukan janji.';
 const structure='ACT I — SETUP (Episode 1): Enzo memulai percakapan; Yuna menyatakan kebutuhan untuk didengarkan.\nINCITING INCIDENT (Episode 1): Yuna mulai membuka kekecewaan yang selama ini dipendam.\nACT II — RISING CONFLICT (Episode 2–4): Alasan kekecewaan terungkap, Enzo menghadapi kesalahannya, dan kesalahpahaman baru menguji kemajuan mereka.\nMIDPOINT — TURNING POINT (Episode 3): Enzo menyadari bahwa meminta maaf saja tidak cukup; ia harus mengubah cara bersikap.\nCRISIS — LOWEST POINT (Episode 4): Kesalahpahaman membuat Yuna meragukan masa depan hubungan mereka.\nACT III — CLIMAX (Episode 5): Enzo mengambil tanggung jawab melalui tindakan tanpa memaksa Yuna memaafkan.\nRESOLUTION (Episode 6): Keduanya menyepakati langkah baru dengan harapan yang realistis.';
 const sections=['STORY BLUEPRINT — '+(st.title||'TEST 02 — ENZO & YUNA'),'FORMAT: Serial drama | 6 episode | GENRE: '+(st.genre||'Drama')+' | TONE: '+(st.tone||'Natural and emotional')+' | AUDIENCE: '+(st.audience||'General audience'),'CORE PREMISE\n'+(st.idea||'Enzo dan Yuna berusaha memperbaiki hubungan setelah pertengkaran.'),'LOGLINE\n'+logline,'STORY WORLD\nSetting: '+(st.setting||'Rumah Enzo di Indonesia, masa kini. Fokus utama di ruang tamu dengan suasana sederhana dan pencahayaan alami yang hangat.')+'\nTheme: '+(st.theme||'Cinta membutuhkan komunikasi, pengertian, kejujuran, dan kemauan untuk saling mendengarkan.'),'CHARACTER ENGINE\nProtagonists: Enzo dan Yuna.\nEnzo — Want: Memperbaiki hubungan dan mendapatkan kembali kepercayaan Yuna. Need: Mendengarkan, mengakui dampak tindakannya, dan konsisten berubah.\nYuna — Want: Dipahami dan memperoleh kejujuran. Need: Mengungkapkan perasaan serta batasannya dengan jelas, lalu menilai perubahan melalui tindakan.\nOpposition: Kesalahpahaman, ego, komunikasi yang buruk, luka emosional, dan keraguan terhadap perubahan.\nStakes: Jika mereka gagal saling memahami, hubungan dapat berakhir dan keduanya kehilangan kesempatan membangun masa depan bersama.\nCHARACTER ARCS\n'+arcs,'SERIES STRUCTURE\n'+structure,'EPISODE ROADMAP — 6 EPISODES\n'+episodeText,'ENDING DIRECTION\nHopeful but realistic: Enzo dan Yuna memilih memberi hubungan mereka kesempatan baru. Penyelesaian tidak menghapus masalah secara ajaib; keduanya menyepakati komunikasi jujur dan perubahan yang perlu dibuktikan setelah cerita berakhir.','DEVELOPMENT CHECKLIST\n[ ] Tetapkan usia, latar belakang, dan kebutuhan batin Enzo serta Yuna.\n[ ] Konfirmasi detail pertengkaran yang menjadi pemicu cerita.\n[ ] Tentukan karakter pendukung hanya jika dibutuhkan.\n[ ] Ubah setiap episode menjadi rangkaian scene dengan tujuan dan konflik spesifik.\n[ ] Periksa kesinambungan emosi, dialog, lokasi, wardrobe, dan posisi karakter.'];
 st.previousOutline=st.previousOutline||st.outline;st.format='Serial drama';st.episodeCount=6;st.seriesTreatment={version:'0.1',episodeTitles:eps.map(e=>e[0]),logline,characterArcs:arcs,updated:new Date().toISOString()};st.outline=sections.join('\n\n');

 saveAndWait().then(ok=>{if(!ok){Object.assign(st,previous);if(el)el.innerHTML=renderStoryBlueprint(st);toast('Gagal menyimpan revisi. Blueprint sebelumnya dipulihkan.');return}toast('Story Blueprint diperbarui menjadi serial 6 episode')}).catch(()=>{Object.assign(st,previous);if(el)el.innerHTML=renderStoryBlueprint(st);toast('Penyimpanan gagal. Blueprint sebelumnya dipulihkan.')});

function renderStoryBlueprint(st){
 return '<div class="panel"><div class="sectionhead"><div><div class="eyebrow">STORY DEVELOPMENT RESULT</div><h2>'+esc(st.title)+'</h2></div><span class="tag">DRAFT</span></div><p class="muted">'+esc(st.format)+' · '+esc(st.genre)+' · '+esc(st.tone)+'</p><div class="actions"><button class="btn small" onclick="copyText(document.getElementById(\'storyBlueprintText-'+st.id+'\').textContent)">Copy Blueprint</button><button class="btn small" onclick="viewStoryBlueprint(\''+st.id+'\')">Full View</button><button class="btn small primary" onclick="developSixEpisodeSeries(\''+st.id+'\')">Develop 6-Episode Series</button></div><div class="promptout" id="storyBlueprintText-'+st.id+'">'+esc(st.outline)+'</div></div>';
}
function buildStoryBreakdown(storyId){

 const plan=[
  ['Opening Image','Perkenalkan dunia cerita dan kondisi awal tokoh utama.','Tampilkan rutinitas, lingkungan, serta satu detail visual yang mewakili keadaan batin tokoh.','Membangun rasa ingin tahu dan memperkenalkan dunia.'],
  ['Character Setup','Perlihatkan kebutuhan, keinginan, dan hubungan penting tokoh.','Tokoh menjalani aktivitas yang memperjelas apa yang ia inginkan dan apa yang belum ia sadari.','Membuat penonton memahami tokoh sebelum konflik dimulai.'],
  ['Inciting Incident','Hadirkan peristiwa pemicu yang mengganggu keadaan normal.','Sebuah kejadian memaksa tokoh bereaksi terhadap masalah utama: '+st.idea,'Mengubah arah cerita dan memunculkan pertanyaan utama.'],
  ['First Decision','Tokoh mengambil keputusan awal untuk menghadapi masalah.','Tunjukkan pilihan konkret dan konsekuensi pertamanya.','Mendorong tokoh masuk ke konflik utama.'],
  ['Rising Conflict','Hambatan bertambah dan hubungan antar tokoh mengalami tekanan.','Rangkaikan usaha, kegagalan kecil, kesalahpahaman, atau pertentangan yang relevan dengan premis.','Menaikkan taruhan dan menjaga momentum.'],
  ['Midpoint Twist','Berikan informasi atau kejadian yang mengubah pemahaman tokoh.','Tokoh mengetahui sesuatu atau mengalami perubahan yang memaksanya meninjau kembali rencana.','Mengubah strategi dan meningkatkan intensitas.'],
  ['Crisis','Rencana tokoh terancam gagal dan konsekuensi terasa nyata.','Hadapkan tokoh pada pilihan sulit yang menyentuh tujuan dan kebutuhan batinnya.','Mencapai titik emosional terendah sebelum klimaks.'],
  ['Climax','Tokoh menghadapi konflik utama dan mengambil keputusan penentu.','Bangun konfrontasi melalui tindakan dan pilihan, bukan penjelasan panjang.','Membayar konflik utama dan membuktikan perubahan tokoh.'],
  ['Resolution','Tunjukkan akibat dari keputusan dan arah hidup setelah konflik.','Tutup dengan nuansa '+(st.ending||'Hopeful')+' dan gambaran perubahan yang dialami tokoh.','Memberi kepuasan emosional dan menegaskan tema.']
 ];
 const previousBreakdown=st.breakdown;st.breakdown=plan.map((p,index)=>({id:id(),number:index+1,title:p[0],purpose:p[1],action:p[2],dramaticFunction:p[3],duration:'15 seconds'}));
 st.breakdownVersion='0.1-local';
 saveAndWait().then(ok=>{if(!ok){st.breakdown=previousBreakdown;toast('Breakdown gagal disimpan. Data sebelumnya dipulihkan.');return}const el=document.getElementById('storyResult');if(el)el.innerHTML=renderStoryBlueprint(st);toast('Scene Breakdown berhasil dibuat dan disimpan')});
}

async function importStoryBreakdown(storyId){
 const st=db.stories.find(x=>x.id===storyId);if(!st||!Array.isArray(st.breakdown)||!st.breakdown.length){toast('Generate Scene Breakdown terlebih dahulu');return}

 if(already.length&&already.every(idValue=>db.scenes.some(sc=>sc.id===idValue))){toast('Breakdown ini sudah ditambahkan ke Scene Builder');return}
 const project=db.projects.find(p=>p.id===st.projectId);
 const created=st.breakdown.map((item,index)=>({id:id(),title:item.title,scene:String(item.number),duration:item.duration,project:project?.title||'',projectId:project?.id||'',character:'',characterId:'',castIds:[],castNames:[],location:'',locationId:'',storyNotes:'Story purpose: '+item.purpose+'\\nDramatic function: '+item.dramaticFunction,description:'Visual setup to be developed: '+item.action,storyBeats:[{id:id(),title:item.title,description:item.purpose,action:item.action,emotion:''}],dialogueEntries:[],dialogue:'',sourceStoryId:st.id,created:new Date().toISOString()}));
 const before=db.scenes.slice(),oldIds=st.importedSceneIds;
 db.scenes=[...created,...db.scenes];st.importedSceneIds=created.map(x=>x.id);
 const ok=await saveAndWait();if(!ok){db.scenes=before;st.importedSceneIds=oldIds;toast('Gagal menambahkan scenes. Data sebelumnya dipulihkan.');return}
 toast(created.length+' scenes ditambahkan ke Scene Builder');
 nav('storyboard');
}

 <div class="scene-tabs"><a href="#scene-details">01 Overview</a><a href="#scene-cast">02 Cast</a><a href="#scene-beats">03 Story Beats</a><a href="#scene-dialogues">04 Dialogue</a><a href="#scene-production">05 Production</a></div>
 <form id="sceneEditorForm" onsubmit="saveScene(event,'${sceneId}')">
 <section class="scene-section" id="scene-details"><h3>01 · Scene Overview</h3><p class="hint">Informasi utama adegan dan proyek.</p><div class="formgrid"><div class="field"><label>Scene / sequence title *</label><input name="title" required value="${val('title')}" placeholder="Contoh: The First Meeting"></div><div class="field"><label>Project</label><select name="project"><option value="">No project</option>${projOpts}</select></div><div class="field"><label>Scene number</label><input name="scene" type="number" min="1" value="${val('scene')||'1'}"></div><div class="field"><label>Estimated duration</label><input name="duration" value="${val('duration')}" placeholder="15 seconds"></div><div class="field"><label>Primary character</label><select name="character"><option value="">Select lead character</option>${charOpts}</select></div><div class="field"><label>Location</label><select name="location"><option value="">Select location</option>${locOpts}</select></div></div><div class="field"><label>Story Notes / Scene Context</label><small class="muted">Isi alasan dan makna adegan: apa yang sedang terjadi dalam cerita, tujuan naratif, konflik, hubungan antar karakter, atau informasi penting yang perlu dipahami penonton. Fokus pada WHY / WHAT IT MEANS, bukan apa yang terlihat di layar. Jangan ulangi lokasi, posisi tubuh, pakaian, properti, pencahayaan, ekspresi, atau gerakan; detail visual awal ditulis di Visual Setup, sedangkan aksi berurutan ditulis di Story Beats.</small><textarea name="storyNotes" placeholder="Contoh: Setelah pertengkaran sebelumnya, Enzo ingin memperbaiki hubungannya dengan Yuna. Adegan ini menjadi momen jeda sebelum ia memutuskan langkah berikutnya.">${val('storyNotes')}</textarea></div><div class="field"><label>Scene Description / Visual Setup</label><small class="muted">Hanya gambarkan hal yang terlihat: lokasi, latar, posisi awal karakter, properti, pencahayaan, cuaca, dan komposisi. Jangan tulis aksi berurutan; masukkan aksi ke Story Beats.</small><textarea name="description" placeholder="Contoh: Ruang tamu rumah sederhana pada sore hari. Sofa cokelat di sisi kiri, jendela terbuka di belakang, cahaya matahari hangat masuk dari jendela. Enzo berdiri dekat pintu.">${val('description')}</textarea></div></section>
 <section class="scene-section" id="scene-cast"><h3>02 · Cast in This Scene</h3><p class="hint">Centang karakter yang tampil di adegan ini, lalu pilih outfit/kostum khusus untuk setiap karakter. Pilihan outfit hanya berlaku pada scene ini dan tidak mengubah Permanent Character DNA.</p><div id="sceneCastList" class="cast-grid">${renderSceneCast()}</div>${!db.characters.length?'<div class="empty">Belum ada DNA Karakter. Buat karakter terlebih dahulu di menu Karakter.</div>':''}<div class="actions" style="margin-top:12px"><button type="button" class="btn" onclick="nav('characters')">＋ Create DNA Karakter</button></div></section>
 <section class="scene-section" id="scene-beats"><h3>03 · Story Beats & Actions</h3><p class="hint">Bagian ini adalah sumber utama urutan aksi. Susun kejadian secara kronologis dari awal sampai akhir. Jangan ulangi urutan aksi di Scene Description atau Story Notes.</p><div id="storyBeatList">${renderStoryBeats()}</div><button type="button" class="scene-add" onclick="addStoryBeat()">＋ Add Story Beat</button><div class="field" style="margin-top:14px"><label>Additional character performance / emotional direction</label><textarea name="emotion" placeholder="Nostalgic, anxious, joyful...">${val('emotion')}</textarea></div><div class="field"><label>Facial expression & gestures</label><textarea name="gesture" placeholder="Subtle smile, lowered gaze, trembling hands...">${val('gesture')}</textarea></div></section>
 <section class="scene-section" id="scene-dialogues"><h3>04 · Dialogue Timeline</h3><p class="hint">Setiap baris dialog memiliki karakter pembicara sendiri. Tambahkan dialog sebanyak yang diperlukan atau hapus baris yang tidak dipakai.</p><div id="dialogueList">${renderDialogueRows()}</div><button type="button" class="scene-add" onclick="addDialogueRow()">＋ Add Dialogue</button><div class="field" style="margin-top:14px"><label>Overall dialogue delivery</label><textarea name="delivery" placeholder="Natural pauses, hesitant, emotional...">${val('delivery')}</textarea></div></section>
 <section class="scene-section" id="scene-production"><h3>05 · Production Direction</h3><p class="hint">Arahan kamera, audio, dan format output tetap menjadi bagian dari scene yang sama.</p><div class="subhead">CAMERA DIRECTOR</div><div class="formgrid"><div class="field"><label>Shot type</label><select name="shot"><option value="">Select shot</option>${['Extreme wide shot','Wide shot','Full shot','Medium shot','Medium close-up','Close-up','Extreme close-up','Over-the-shoulder','POV shot'].map(a=>`<option ${x.shot===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label>Camera angle</label><select name="angle"><option value="">Select angle</option>${['Eye-level','Low angle','High angle','Dutch angle','Bird’s-eye view','Worm’s-eye view','Overhead'].map(a=>`<option ${x.angle===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label>Camera movement</label><select name="movement"><option value="">Select movement</option>${['Static','Slow dolly-in','Slow dolly-out','Pan left','Pan right','Tilt up','Tilt down','Tracking shot','Handheld','Crane shot','Orbit'].map(a=>`<option ${x.movement===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label>Lens / visual feel</label><input name="lens" value="${val('lens')}" placeholder="Natural perspective, 50mm cinematic lens"></div></div><div class="field"><label>Additional camera direction</label><textarea name="camera">${val('camera')}</textarea></div><div class="subhead">AUDIO DIRECTOR</div><div class="formgrid"><div class="field"><label>Music direction</label><textarea name="music">${val('music')}</textarea></div><div class="field"><label>Ambience</label><textarea name="ambience">${val('ambience')}</textarea></div></div><div class="field"><label>Sound effects (SFX)</label><textarea name="sfx">${val('sfx')}</textarea></div><div class="field"><label>Additional audio direction</label><textarea name="audio">${val('audio')}</textarea></div><div class="subhead">OUTPUT SETTINGS</div><div class="formgrid"><div class="field"><label>Aspect ratio</label><select name="ratio">${['9:16','16:9','1:1','4:5','2.39:1'].map(a=>`<option ${x.ratio===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label>Video platform / model</label><select name="platform">${['Universal AI Video','Veo','Seedance','Kling','Runway','PixVerse','Sora','Other'].map(a=>`<option ${x.platform===a?'selected':''}>${a}</option>`).join('')}</select></div></div><div class="field"><label>Negative prompt / avoid</label><textarea name="negative">${val('negative')}</textarea></div></section>
 <div class="actions"><button class="btn primary" type="submit">${isEdit?'Save Scene Changes':'Save New Scene'}</button><button type="button" class="btn ghost" onclick="document.getElementById('sceneForm').innerHTML=''">Cancel</button></div></form></div>`;
 document.getElementById('sceneForm').scrollIntoView({behavior:'smooth',block:'start'});
}
function renderSceneCast(){if(!db.characters.length)return '';return db.characters.map(c=>{let active=sceneEditorDraft.castIds.includes(c.id),selected=sceneEditorDraft.variationIds?.[c.id]||'';let options=(c.variations||[]).map(v=>`<option value="${v.id}" ${selected===v.id?'selected':''}>${esc(v.name||'Variasi')} · ${esc(v.type||'')}</option>`).join('');let selectedVariation=(c.variations||[]).find(v=>v.id===selected);return `<div class="cast-option" style="display:block"><label style="display:flex;align-items:center;gap:9px"><input type="checkbox" value="${c.id}" ${active?'checked':''} onchange="toggleSceneCast('${c.id}',this.checked)"><span><b>${esc(c.name)}</b><br><small class="muted">${esc(c.role||'Karakter')} · ${esc(c.age||'Usia belum diatur')}</small></span></label><div class="field" style="margin:9px 0 0"><label>Outfit / variasi untuk adegan ini</label><small class="muted">Pilih kostum yang dipakai karakter pada scene ini. Pilihan tidak mengubah Permanent Character DNA.</small><select ${active?'':'disabled'} onchange="setSceneVariation('${c.id}',this.value)"><option value="">Gunakan Permanent DNA / outfit default</option>${options}</select>${selectedVariation?`<small class="muted">Terpilih: ${esc(selectedVariation.name||'Variasi')} — ${esc(selectedVariation.type||'Variasi')}. ${esc(selectedVariation.description||'')}</small>`:''}</div></div>`}).join('')}
function setSceneVariation(cid,variationId){sceneEditorDraft.variationIds=sceneEditorDraft.variationIds||{};if(variationId)sceneEditorDraft.variationIds[cid]=variationId;else delete sceneEditorDraft.variationIds[cid]}
function toggleSceneCast(cid,checked){if(checked&&!sceneEditorDraft.castIds.includes(cid))sceneEditorDraft.castIds.push(cid);if(!checked){sceneEditorDraft.castIds=sceneEditorDraft.castIds.filter(x=>x!==cid);delete (sceneEditorDraft.variationIds||{})[cid];let lead=document.querySelector('#sceneEditorForm select[name=character]'),c=db.characters.find(z=>z.id===cid);if(lead&&c&&lead.value===c.id)lead.value=''}let castEl=document.getElementById('sceneCastList');if(castEl)castEl.innerHTML=renderSceneCast();renderDialogueRowsIntoDOM()}
function renderDialogueRowsIntoDOM(){let el=document.getElementById('dialogueList');if(el)el.innerHTML=renderDialogueRows()}
function renderDialogueRows(){if(!sceneEditorDraft.dialogues.length)return '<div class="empty">Belum ada dialog. Tekan Add Dialogue untuk membuat percakapan pertama.</div>';return sceneEditorDraft.dialogues.map((d,i)=>`<div class="editor-card"><div class="editor-card-head"><strong>Dialogue ${i+1}</strong><button type="button" class="btn small danger" onclick="removeDialogue('${d.id}')">Remove</button></div><div class="field"><label>Speaker</label><select onchange="updateDialogue('${d.id}','characterId',this.value)"><option value="">Choose speaker</option>${db.characters.filter(c=>sceneEditorDraft.castIds.includes(c.id)).map(c=>`<option value="${c.id}" ${d.characterId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Dialogue text (Bahasa Indonesia)</label><textarea oninput="updateDialogue('${d.id}','text',this.value)" placeholder="Tuliskan kalimat yang diucapkan karakter...">${esc(d.text||'')}</textarea></div><div class="field"><label>Delivery / emotion</label><input value="${esc(d.delivery||'')}" oninput="updateDialogue('${d.id}','delivery',this.value)" placeholder="Soft, hesitant, angry, whispering..."></div></div>`).join('')}
function addDialogueRow(){sceneEditorDraft.dialogues.push({id:id(),characterId:sceneEditorDraft.castIds[0]||'',text:'',delivery:''});renderDialogueRowsIntoDOM()}
function updateDialogue(did,key,value){let d=sceneEditorDraft.dialogues.find(x=>x.id===did);if(d)d[key]=value}
function removeDialogue(did){sceneEditorDraft.dialogues=sceneEditorDraft.dialogues.filter(x=>x.id!==did);renderDialogueRowsIntoDOM()}
function inferBeatEmotion(beat){
 const text=[beat?.title,beat?.description,beat?.action].filter(Boolean).join(' ').toLowerCase();
 if(/menangis|air mata|terisak|kecewa|terluka|sedih|maaf|menyesal|bersalah/.test(text))return 'Hurt, sadness or regret; use restrained facial expression and natural pauses.';
 if(/marah|membentak|berteriak|bertengkar|kesal/.test(text))return 'Frustrated or angry; controlled tension, firmer voice and natural gestures without exaggeration.';
 if(/tersenyum|tertawa|bahagia|senang|lega/.test(text))return 'Warm, relieved or happy; subtle smile and relaxed body language.';
 if(/takut|cemas|khawatir|ragu|gugup/.test(text))return 'Anxious or hesitant; subtle tension, brief pauses and restrained eye movement.';
 if(/terkejut|kaget|heran/.test(text))return 'Surprised; a brief natural reaction before settling.';
 if(/diam|mendengarkan|menatap|menunggu/.test(text))return 'Quiet, attentive and emotionally restrained; natural breathing and subtle eye contact.';
 return 'Use a natural, emotionally restrained performance that matches the story context and the character personality.';
}
function inferDialogueDelivery(entry){
 const t=String(entry?.text||'').toLowerCase();
 if(/maaf|menyesal|bersalah|kecewa|terluka|sedih|rindu|menangis/.test(t))return 'Soft, sincere and emotionally restrained, with natural pauses and subtle vulnerability.';
 if(/marah|jangan|berhenti|cukup|kenapa kamu/.test(t))return 'Firm and emotionally tense, but natural; avoid shouting unless explicitly required by the story.';
 if(/terima kasih|aku sayang|cinta|bahagia|senang/.test(t))return 'Warm, gentle and sincere, with a natural conversational rhythm.';
 if(/takut|khawatir|cemas|tidak tahu|bingung/.test(t))return 'Hesitant and concerned, with brief natural pauses and subtle uncertainty.';
 return 'Natural conversational delivery in Bahasa Indonesia, with clear pronunciation, character-appropriate emotion and accurate lip synchronization.';
}
function inferBeatContext(beat,index){
 const title=String(beat?.title||('Story Beat '+(index+1))).replace(/^Beat\s*\d+\s*[—:-]?\s*/i,'');
 return title?('This moment focuses on '+title.toLowerCase()+'. Keep the action connected to the preceding and following story moments.'):'Continue the scene naturally, preserving the established story flow.';
}
function renderStoryBeats(){if(!sceneEditorDraft.beats.length)return '<div class="empty">Belum ada story beat. Tambahkan momen pertama untuk mulai menyusun alur.</div>';return sceneEditorDraft.beats.map((b,i)=>`<div class="editor-card"><div class="editor-card-head"><strong>Story Beat ${i+1}</strong><button type="button" class="btn small danger" onclick="removeStoryBeat('${b.id}')">Remove</button></div><div class="field"><label>Beat title</label><input value="${esc(b.title||'')}" oninput="updateStoryBeat('${b.id}','title',this.value)" placeholder="Contoh: Enzo notices Yuna at the door"></div><div class="field"><label>Moment context (optional)</label><textarea oninput="updateStoryBeat('${b.id}','description',this.value)" placeholder="Konteks singkat momen ini; jangan mengulang deskripsi aksi.">${esc(b.description||'')}</textarea></div><div class="field"><label>Character action / reaction</label><textarea oninput="updateStoryBeat('${b.id}','action',this.value)" placeholder="Tuliskan gerakan atau reaksi karakter pada momen ini.">${esc(b.action||'')}</textarea></div><div class="field"><label>Emotional change (optional)</label><input value="${esc(b.emotion||'')}" oninput="updateStoryBeat('${b.id}','emotion',this.value)" placeholder="Curious, surprised, relieved..."></div></div>`).join('')}
function addStoryBeat(){sceneEditorDraft.beats.push({id:id(),title:`Story Beat ${sceneEditorDraft.beats.length+1}`,description:'',action:'',emotion:''});let el=document.getElementById('storyBeatList');if(el)el.innerHTML=renderStoryBeats()}
function updateStoryBeat(bid,key,value){let b=sceneEditorDraft.beats.find(x=>x.id===bid);if(b)b[key]=value}
function removeStoryBeat(bid){sceneEditorDraft.beats=sceneEditorDraft.beats.filter(x=>x.id!==bid);let el=document.getElementById('storyBeatList');if(el)el.innerHTML=renderStoryBeats()}
function editScene(sceneId){sceneForm(sceneId)}
async function saveScene(e,sceneId=''){
 e.preventDefault();let beforeAdegan=db.scenes.slice(),f=new FormData(e.target),existing=db.scenes.find(x=>x.id===sceneId),lead=f.get('character')||'';
 let castIds=[...new Set(sceneEditorDraft.castIds)];if(lead&&!castIds.includes(lead))castIds.unshift(lead)
 let dialogueEntries=sceneEditorDraft.dialogues.map(d=>({...d,characterName:db.characters.find(c=>c.id===d.characterId)?.name||''})).filter(d=>d.text.trim());
 let dialogue=dialogueEntries.map(d=>`${d.characterName||'Character'}: "${d.text.trim()}"`).join('\n');
 let beats=sceneEditorDraft.beats.filter(b=>[b.title,b.description,b.action,b.emotion].some(v=>(v||'').trim()));
 let selectedProject=db.projects.find(p=>p.id===f.get('project')),selectedLocation=db.locations.find(l=>l.id===f.get('location')),leadCharacter=db.characters.find(c=>c.id===lead);let variationIds=Object.fromEntries(Object.entries(sceneEditorDraft.variationIds||{}).filter(([cid,vid])=>castIds.includes(cid)&&db.characters.find(c=>c.id===cid)?.variations?.some(v=>v.id===vid)));let obj={...(existing||{}),variationIds,id:sceneId||id(),title:f.get('title').trim(),project:selectedProject?.title||'',projectId:selectedProject?.id||'',scene:f.get('scene'),duration:f.get('duration'),character:leadCharacter?.name||'',characterId:leadCharacter?.id||'',castIds,castNames:castIds.map(cid=>db.characters.find(c=>c.id===cid)?.name).filter(Boolean),location:selectedLocation?.name||'',locationId:selectedLocation?.id||'',description:f.get('description'),storyNotes:f.get('storyNotes'),storyBeats:beats,action:f.get('action')||'',emotion:f.get('emotion'),gesture:f.get('gesture'),dialogueEntries,dialogue:dialogue||f.get('dialogue')||'',delivery:f.get('delivery'),shot:f.get('shot'),angle:f.get('angle'),movement:f.get('movement'),lens:f.get('lens'),camera:f.get('camera'),music:f.get('music'),ambience:f.get('ambience'),sfx:f.get('sfx'),audio:f.get('audio'),ratio:f.get('ratio'),platform:f.get('platform'),negative:f.get('negative'),updated:new Date().toISOString()};
 if(existing)db.scenes=db.scenes.map(x=>x.id===sceneId?obj:x);else db.scenes.unshift(obj);if(await saveAndWait()){render();toast(existing?'Scene berhasil diperbarui':'Scene berhasil dibuat')}else{db.scenes=beforeAdegan;toast('Gagal menyimpan scene. Perubahan dibatalkan; periksa ruang penyimpanan perangkat.')} 
}
function prompts(){let characterOptions=db.characters.map(c=>'<div class="panel character-choice-card"><label class="character-choice-main"><input type="checkbox" data-character-id="'+esc(c.id)+'" onchange="refreshPromptVariations()"><span class="character-choice-copy"><span class="character-choice-name">'+esc(c.name)+'</span><small class="muted character-choice-role">'+esc(c.role||'Character')+'</small></span></label><div class="character-choice-variation"><label>Variation — '+esc(c.name)+'</label><select data-variation-for="'+esc(c.id)+'" disabled><option value="">Permanent DNA / default</option>'+ (c.variations||[]).map(v=>'<option value="'+esc(v.id)+'">'+esc(v.name||'Unnamed variation')+' · '+esc(v.type||'Unspecified')+'</option>').join('')+'</select></div></div>').join('');return `${header('INTELLIGENT PROMPT ENGINE','Studio Prompt','Bangun master prompt produksi dengan arahan performa, kamera, audio, dan continuity check.')}<div class="panel"><div class="formgrid"><div class="field"><label>Sequence</label><select id="pScene" onchange="prefillPrompt()"><option value="">Manual prompt</option>${db.scenes.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select></div><div class="field"><label>Visual style</label><input id="pStyle" value="Cinematic, photorealistic, high detail"></div><div class="field"><label>Shot duration</label><input id="pDuration" placeholder="Example: 15 seconds"></div><div class="field"><label>Aspect ratio</label><select id="pRatio"><option>9:16</option><option>16:9</option><option>1:1</option><option>4:5</option><option>2.39:1</option></select></div><div class="field"><label>Target video platform</label><select id="pPlatform">${['Universal AI Video','Veo','Seedance','Kling','Runway','PixVerse','Sora','Other'].map(a=>`<option>${a}</option>`).join('')}</select></div><div class="field"><label>Character references — pilih satu atau lebih</label><div id="pCharacterChoices" class="list character-choice-list" style="max-height:420px;overflow-y:auto;overflow-x:hidden;padding:10px;border:1px solid var(--line);border-radius:14px">${characterOptions||'<div class="empty">Belum ada karakter di Character Bible.</div>'}</div><small class="muted">Multi-select aktif. Setiap karakter memakai Permanent DNA Karakter sendiri dan variasi opsional masing-masing.</small></div><div class="field"><label>Location reference</label><select id="pLoc"><option value="">None</option>${db.locations.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></div></div><div class="field"><label>Scene description</label><textarea id="pDesc"></textarea></div><div class="field"><label>Character actions</label><textarea id="pAction"></textarea></div><div class="formgrid"><div class="field"><label>Emotional direction</label><textarea id="pEmotion"></textarea></div><div class="field"><label>Facial expression & gestures</label><textarea id="pGesture"></textarea></div></div><div class="field"><label>Dialogue (Bahasa Indonesia)</label><textarea id="pDialogue"></textarea></div><div class="field"><label>Dialogue delivery</label><textarea id="pDelivery"></textarea></div><div class="subhead">CAMERA DIRECTOR</div><div class="formgrid"><div class="field"><label>Shot type</label><input id="pShot" placeholder="Medium shot"></div><div class="field"><label>Camera angle</label><input id="pAngle" placeholder="Eye-level"></div><div class="field"><label>Camera movement</label><input id="pMovement" placeholder="Slow dolly-in"></div><div class="field"><label>Lens / visual feel</label><input id="pLens" placeholder="50mm cinematic lens"></div></div><div class="field"><label>Additional camera direction</label><textarea id="pCamera"></textarea></div><div class="subhead">AUDIO DIRECTOR</div><div class="formgrid"><div class="field"><label>Music direction</label><textarea id="pMusic"></textarea></div><div class="field"><label>Ambience</label><textarea id="pAmbience"></textarea></div></div><div class="field"><label>Sound effects (SFX)</label><textarea id="pSfx"></textarea></div><div class="field"><label>Additional audio direction</label><textarea id="pAudio"></textarea></div><div class="field"><label>Negative prompt / avoid</label><textarea id="pNegative" placeholder="Avoid identity drift, face distortion... "></textarea></div><div class="actions"><button class="btn primary" onclick="buildPrompt()">✧ Build Video Prompt</button><button class="btn" onclick="copyText(document.getElementById('promptOutput')?.textContent||'')">Copy Prompt</button></div></div><div class="panel"><div class="sectionhead"><h2>Continuity Checker</h2><span class="tag">PRE-FLIGHT CHECK</span></div><div id="continuityCheck" class="checklist"><div class="checkrow">Pilih sequence untuk memeriksa kelengkapan produksi.</div></div></div><div class="panel"><div class="sectionhead"><h2>Prompt Output</h2><span class="tag">MASTER PRODUCTION PROMPT</span></div><div id="promptOutput" class="promptout">Your generated production prompt will appear here.</div><div class="actions" style="margin-top:12px"><button class="btn" onclick="copyText(document.getElementById('promptOutput')?.textContent||'')">Copy Master Prompt</button></div></div>`}
function refreshPromptVariations(selectedIds=null){
 const host=document.getElementById('pCharacterChoices');if(!host)return;
 const checked=selectedIds===null?Array.from(host.querySelectorAll('input[data-character-id]:checked')).map(x=>x.dataset.characterId):selectedIds;
 const variations={};
 host.querySelectorAll('select[data-variation-for]').forEach(x=>variations[x.dataset.variationFor]=x.value);
 host.innerHTML=db.characters.length?db.characters.map(c=>{
  const isChecked=checked.includes(c.id),options=(c.variations||[]).map(v=>'<option value="'+esc(v.id)+'" '+(variations[c.id]===v.id?'selected':'')+'>'+esc(v.name||'Unnamed variation')+' · '+esc(v.type||'Unspecified')+'</option>').join('');
  return '<div class="character-choice-card"><label class="character-choice-main"><input type="checkbox" data-character-id="'+esc(c.id)+'" '+(isChecked?'checked':'')+' onchange="refreshPromptVariations()"><span class="character-choice-copy"><span class="character-choice-name">'+esc(c.name)+'</span><small class="muted character-choice-role">'+esc(c.role||'Character')+'</small></span></label><div class="character-choice-variation"><label>Variation — '+esc(c.name)+'</label><select data-variation-for="'+esc(c.id)+'" '+(!isChecked?'disabled':'')+'><option value="">Permanent DNA / default</option>'+options+'</select></div></div>';
 }).join(''):'<div class="empty">Belum ada karakter di Character Bible.</div>';
}

function setField(idv,value){let el=document.getElementById(idv);if(el)el.value=value||''}
function prefillPrompt(){let s=db.scenes.find(x=>x.id===document.getElementById('pScene').value);if(!s)return;let map={pDuration:s.duration,pRatio:s.ratio,pPlatform:s.platform,pDesc:s.description,pAction:(s.storyBeats||[]).length?'':s.action,pEmotion:s.emotion,pGesture:s.gesture,pDialogue:s.dialogue,pDelivery:s.delivery,pShot:s.shot,pAngle:s.angle,pMovement:s.movement,pLens:s.lens,pCamera:s.camera,pMusic:s.music,pAmbience:s.ambience,pSfx:s.sfx,pAudio:s.audio,pNegative:s.negative};Object.entries(map).forEach(([k,v])=>setField(k,v));let l=db.locations.find(x=>x.id===s.locationId)||db.locations.find(x=>x.name===s.location);refreshPromptVariations(s.castIds?.length?s.castIds:(s.characterId?[s.characterId]:[]));setField('pLoc',l?.id||'');if(s.dialogueEntries?.length)setField('pDialogue',s.dialogueEntries.map(d=>(d.characterName||db.characters.find(z=>z.id===d.characterId)?.name||'Character')+': \"'+d.text+'\"'+(d.delivery?' ['+d.delivery+']':'')).join('\n'));runContinuityCheck(s)}
function runContinuityCheck(s=null){let el=document.getElementById('continuityCheck');if(!el)return;let scene=s||db.scenes.find(x=>x.id===document.getElementById('pScene')?.value);if(!scene){el.innerHTML='<div class="checkrow">Pilih sequence untuk memeriksa kelengkapan produksi.</div>';return}let checks=[['Duration',!!(scene.duration||document.getElementById('pDuration')?.value)],['Character reference',!!(scene.castIds?.length||scene.characterId||document.querySelector('#pCharacterChoices input[data-character-id]:checked'))],['Location reference',!!(scene.location||document.getElementById('pLoc')?.value)],['Scene description',!!(scene.description||document.getElementById('pDesc')?.value)],['Character action',!!(scene.action||document.getElementById('pAction')?.value)],['Emotional direction',!!(scene.emotion||document.getElementById('pEmotion')?.value)],['Camera direction',!!(scene.camera||scene.shot||document.getElementById('pCamera')?.value||document.getElementById('pShot')?.value)],['Audio direction',!!(scene.audio||scene.music||scene.ambience||document.getElementById('pAudio')?.value||document.getElementById('pMusic')?.value)]];let missing=checks.filter(x=>!x[1]);el.innerHTML=checks.map(([n,ok])=>`<div class="checkrow">${ok?'✓':'○'} ${n} — ${ok?'Ready':'Not set'}</div>`).join('')+`<div class="checkrow"><b>${missing.length?missing.length+' item(s) need attention':'All core checks passed'}</b>. This is a completeness check, not an AI quality guarantee.</div>`}
function buildPrompt(){
 let selectedCharacterIds=Array.from(document.querySelectorAll('#pCharacterChoices input[data-character-id]:checked')).map(x=>x.dataset.characterId);
 let scene=db.scenes.find(x=>x.id===document.getElementById('pScene').value),l=db.locations.find(x=>x.id===document.getElementById('pLoc').value);
 if(!selectedCharacterIds.length&&scene?.castIds?.length)selectedCharacterIds=scene.castIds.slice();
 let selectedKarakter=selectedCharacterIds.map(cid=>db.characters.find(x=>x.id===cid)).filter(Boolean);
 let v=id=>document.getElementById(id)?.value.trim()||'',duration=v('pDuration')||(scene?.duration?.trim())||'Not specified — add sequence duration',lines=[];
 let add=(h,t)=>{if(t&&String(t).trim())lines.push(h+'\n'+String(t).trim())};
 lines.push('AI VIDEO MASTER PRODUCTION PROMPT');
 add('PROJECT',scene?.project||'Unassigned project');
 add('SCENE / SEQUENCE',scene?`Scene ${scene.scene||'—'} — ${scene.title}`:'Manual sequence');
 add('TARGET PLATFORM',v('pPlatform'));
 add('SHOT DURATION',duration.toLowerCase().includes('second')?duration:duration+' seconds');
 add('ASPECT RATIO',v('pRatio'));add('VISUAL STYLE',v('pStyle'));
 let characterReferenceText=selectedKarakter.map(ch=>{
  let permanent=ch.permanentDNA||{},variationSelect=Array.from(document.querySelectorAll('#pCharacterChoices select[data-variation-for]')).find(x=>x.dataset.variationFor===ch.id),variation=(ch.variations||[]).find(x=>x.id===variationSelect?.value);
  return ch.name+', '+(ch.age||'age not specified')+'. PERMANENT IDENTITY — Physical appearance: '+(permanent.appearance||ch.appearance||'Use approved character reference')+'. Personality: '+(permanent.personality||ch.personality||'As established')+'. Voice identity: '+(permanent.voice||ch.voice||'Maintain established voice identity')+'. Identity rules: '+(permanent.consistencyRules||ch.consistencyRules||'Never alter face, hairstyle, skin tone, body proportions or core identity')+'. '+(variation?'SELECTED VARIATION — '+(variation.name||'Unnamed')+' ['+(variation.type||'Unspecified')+']: '+(variation.description||'Follow the selected variation reference')+'. Variation ID: '+variation.id+'. Apply this variation only; do not modify Permanent DNA Karakter.':'Use approved default appearance; do not invent changes.');
 }).join('\n\n');
 add('CHARACTER REFERENCES — ALL SELECTED CAST',characterReferenceText||'Use approved permanent character references; do not invent or alter identities.');
 add('LOCATION REFERENCE',l?`${l.name}. ${l.environment||''} Lighting: ${l.lighting||'As established'}. Atmosphere: ${l.atmosphere||'As established'}.`:'Use approved location reference and preserve its layout.');
 add('SCENE IDEA / STORY NOTES',scene?.storyNotes||'');add('SCENE DESCRIPTION',v('pDesc'));
 if(scene?.storyBeats?.length)add('STORY BEATS',scene.storyBeats.map((b,i)=>`${i+1}. ${b.title||'Beat '+(i+1)}\nWhat happens: ${b.description||''}\nAction / reaction: ${b.action||''}\nEmotional change: ${b.emotion||''}`).join('\n\n'));
 if(!scene?.storyBeats?.length)add('CHARACTER ACTIONS',v('pAction'));
 add('EMOTIONAL DIRECTION',v('pEmotion'));add('FACIAL EXPRESSION & GESTURES',v('pGesture'));
 add('DIALOGUE — SPOKEN IN INDONESIAN',v('pDialogue')||(scene?.dialogueEntries||[]).map(d=>(d.characterName||db.characters.find(z=>z.id===d.characterId)?.name||'Character')+': "'+d.text+'"').join('\n'));
 add('DIALOGUE DELIVERY',v('pDelivery'));
 let cam=[v('pShot')&&'Shot type: '+v('pShot'),v('pAngle')&&'Camera angle: '+v('pAngle'),v('pMovement')&&'Camera movement: '+v('pMovement'),v('pLens')&&'Lens / visual feel: '+v('pLens'),v('pCamera')].filter(Boolean).join('\n');add('CAMERA DIRECTION',cam);
 let aud=[v('pMusic')&&'Music: '+v('pMusic'),v('pAmbience')&&'Ambience: '+v('pAmbience'),v('pSfx')&&'Sound effects: '+v('pSfx'),v('pAudio')].filter(Boolean).join('\n');add('AUDIO DIRECTION',aud);
 add('NEGATIVE PROMPT / AVOID',v('pNegative'));
 lines.push('CONTINUITY REQUIREMENTS\nPreserve the approved identity, facial features, hairstyle, body proportions, costume and voice of EVERY selected character independently. Never merge, swap, duplicate or alter character identities. Preserve location layout, lighting logic and established visual style. Do not introduce unapproved changes. Maintain natural movement, coherent physics, stable props and cinematic composition.');
 if(v('pDialogue'))lines.push('DIALOGUE SYNC\nKeep the spoken Indonesian dialogue exactly as written. Match mouth movement to the dialogue timing. Do not add, omit or translate spoken words.');
 promptResult=lines.join('\n\n');let out=document.getElementById('promptOutput');if(out)out.textContent=promptResult;runContinuityCheck(scene);toast('Master prompt berhasil dirakit untuk '+selectedKarakter.length+' karakter.');
}

akan untuk menjaga konsistensi visual.">${esc(editing?.notes||'')}</textarea></div><div class="actions"><button class="btn primary" onclick="saveAsset()">${editing?'Save Changes':'＋ Save Asset'}</button>${editing?'<button class="btn" onclick="cancelAssetEdit()">Cancel Edit</button>':''}</div><p class="muted" style="font-size:11px">Gambar disimpan secara lokal di browser. Batas ukuran 1,2 MB per gambar untuk menjaga ruang penyimpanan perangkat. Saat mengedit, gambar lama tetap dipakai jika tidak memilih gambar baru.</p></div><div class="panel"><div class="sectionhead"><h2>Asset Collection</h2><div class="actions"><span class="mini-tag">${db.assets.length} items</span><button class="btn primary small" onclick="showAssetEditor()">＋ Add Asset</button></div></div><div class="field"><label>Search asset</label><input id="assetSearch" placeholder="Cari nama, kategori, project..." oninput="renderAssetGrid()"></div><div class="field"><label>Filter category</label><select id="assetFilter" onchange="renderAssetGrid()"><option value="">All categories</option>${categories.map(c=>`<option>${c}</option>`).join('')}</select></div><div id="assetGrid" class="cards">${renderAssetGridHTML()}</div></div>`}

async function saveAsset(){
 let file=document.getElementById('assetFile')?.files[0],name=document.getElementById('assetName')?.value.trim()||file?.name||'',existing=(db.assets||[]).find(a=>a.id===assetEditingId);

 if(file&&file.size>1200000){toast('Gambar terlalu besar. Pilih file di bawah 1.2 MB.');return}
 let data=existing?.data||'';
 if(file){try{data=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Gagal membaca file gambar'));r.readAsDataURL(file)})}catch(e){toast(e.message);return}}
 let asset={...(existing||{}),id:existing?.id||id(),name,data,category:document.getElementById('assetCategory')?.value||'Other',projectId:document.getElementById('assetProject')?.value||'',characterId:document.getElementById('assetCharacter')?.value||'',notes:document.getElementById('assetNotes')?.value.trim()||'',created:existing?.created||new Date().toISOString(),updated:existing?new Date().toISOString():undefined};

 if(await saveAndWait()){assetEditingId='';render();toast(existing?'Asset berhasil diperbarui':'Asset berhasil disimpan')}

}

><span>Karakter</span><b>${db.characters.length}</b></div><div class="item"><span>Lokasi</span><b>${db.locations.length}</b></div><div class="item"><span>Sequences</span><b>${db.scenes.length}</b></div><div class="item"><span>Assets</span><b>${db.assets.length}</b></div><div class="item"><span>Prompt Drafts / Jobs</span><b>${(db.generations||[]).length}</b></div></div></div><div class="panel"><h2>About</h2><p>STORYMATE STUDIO V0.8.5.0 PWA<br><span class="muted">Installable PWA · HTTPS · IndexedDB · Offline App Shell · JSON Backup</span></p><p class="muted" style="font-size:12px">V0.8.0 memperkuat penyimpanan, backup/restore, dan konfirmasi transaksi. Baseline V0.7.2 memperbaiki tampilan detail Character Variations, menyediakan View/Edit Variation, dan mencegah ID variasi duplikat. V0.7.1 menambahkan Character Bible dengan Permanent DNA Karakter, variasi Costume/Expression/Story Age/Physical Condition, serta relasi asset ke karakter. V0.7.1 juga menambahkan alur Add Asset yang lebih mudah ditemukan, Edit Asset, penggantian gambar opsional, relasi project, dan penghapusan dengan konfirmasi serta rollback bila penyimpanan gagal. V0.7.0 menyempurnakan Pustaka Aset dengan kategori, relasi project, catatan, pencarian, filter, unduh asset, serta penyimpanan IndexedDB yang dikonfirmasi. Fondasi PWA, dukungan offline, dan backup JSON tetap dipertahankan. V0.6.0 menambahkan dukungan PWA untuk hosting HTTPS, service worker untuk app shell offline, manifest dan ikon instalasi, antrean penulisan IndexedDB yang menunggu transaksi selesai, permintaan persistent storage, serta backup/restore JSON. Data tetap lokal pada browser/perangkat ini; belum ada sinkronisasi cloud. Jangan hapus versi lama sebelum membuat backup.</p><button class="btn danger" onclick="resetAllLocalData()">Reset All Local Data</button></div>`}
async function testPersistentStorage(){if(!idb){try{await openPersistentDB()}catch(e){storageState={mode:'fallback',message:'IndexedDB gagal dibuka: '+e.message,lastSave:''};render();return}}try{let probe='storage-test-'+Date.now();await new Promise((resolve,reject)=>{let tx=idb.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put({probe,at:new Date().toISOString()},'__probe__');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});let read=await new Promise((resolve,reject)=>{let tx=idb.transaction(IDB_STORE,'readonly'),r=tx.objectStore(IDB_STORE).get('__probe__');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});await new Promise((resolve,reject)=>{let tx=idb.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).delete('__probe__');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Delete probe aborted'))});storageState={mode:'indexeddb',message:read?.probe===probe?'Tes tulis, baca, dan hapus IndexedDB berhasil pada sesi ini. Tutup dan buka ulang aplikasi untuk menguji persistensi lintas sesi.':'Tes baca/tulis tidak cocok; ekspor backup dan jangan mengandalkan database ini.',lastSave:storageState.lastSave};render();toast(read?.probe===probe?'Test Storage berhasil':'Test Storage gagal')}catch(e){storageState={mode:'fallback',message:'Tes IndexedDB gagal: '+e.message+'. Gunakan Export Backup dan pertimbangkan menjalankan aplikasi melalui HTTPS/PWA.',lastSave:storageState.lastSave};render();toast('Test Storage gagal')}}

async function requestPersistentStorage(){try{if(!navigator.storage?.persist){toast('Browser tidak menyediakan permintaan penyimpanan permanen.');return}let granted=await navigator.storage.persist();storageState.message=granted?'Browser memberikan izin penyimpanan persisten.':'Browser belum memberikan izin persisten; lakukan backup berkala.';render();toast(granted?'Perlindungan penyimpanan diberikan':'Izin persisten tidak diberikan')}catch(e){toast('Tidak dapat meminta izin penyimpanan: '+e.message)}}
function projectBundle(pid){
 const project=db.projects.find(p=>p.id===pid);if(!project)throw new Error('Project tidak ditemukan.');
 const scenes=db.scenes.filter(x=>x.projectId===pid||x.project===project.title);
 const characterIds=new Set();scenes.forEach(x=>{if(x.characterId)characterIds.add(x.characterId);(x.castIds||[]).forEach(id=>characterIds.add(id));(x.dialogueEntries||[]).forEach(d=>{if(d.characterId)characterIds.add(d.characterId)})});
 db.characters.filter(c=>c.projectId===pid||c.project===project.title).forEach(c=>characterIds.add(c.id));
 const characters=db.characters.filter(c=>characterIds.has(c.id));
 const locationIds=new Set(scenes.map(x=>x.locationId).filter(Boolean));
 db.locations.filter(l=>l.projectId===pid||l.project===project.title).forEach(l=>locationIds.add(l.id));
 const locations=db.locations.filter(l=>locationIds.has(l.id));
 const assetIds=new Set();characters.forEach(c=>(c.assetIds||[]).forEach(id=>assetIds.add(id)));scenes.forEach(scene=>(scene.assetIds||[]).forEach(id=>assetIds.add(id)));
 const assets=db.assets.filter(a=>a.projectId===pid||a.project===project.title||characterIds.has(a.characterId)||assetIds.has(a.id));
 const sceneIds=new Set(scenes.map(x=>x.id));
 const stories=db.stories.filter(x=>x.projectId===pid||x.project===project.title);
 const generations=db.generations.filter(x=>x.projectId===pid||x.project===project.title||sceneIds.has(x.sceneId));
 return {app:'STORYMATE STUDIO',scope:'project',version:APP_VERSION,schemaVersion:BACKUP_SCHEMA,exportedAt:new Date().toISOString(),projectId:pid,data:{projects:[project],characters,locations,scenes,assets,stories,generations,production:db.production||{},activeProject:pid}};
